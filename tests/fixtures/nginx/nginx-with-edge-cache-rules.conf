# The parts of the Ansible role's nginx.conf that vhost template v5 relies on:
# the edge cache (v3), no HTML in it (906d99f), and what it leaves to jrok.
http {
    proxy_cache_path /var/cache/nginx/jrok levels=1:2 keys_zone=jrok_cache:20m max_size=1g inactive=7d use_temp_path=off;
    map $upstream_http_content_type $jrok_is_html {
        "~*^text/html" 1;
        default 0;
    }
    map $upstream_http_cache_control $jrok_not_shareable {
        "~*(^|[ ,])(public|s-maxage=)" 0;
        default 1;
    }
    map $host $jrok_host_cache_off {
        default 0;
        include /etc/nginx/jrok-cache-off.map;
    }
    geo $jrok_ip_cache_off {
        default 0;
        include /etc/nginx/jrok-blocked-ips.geo;
    }
    map "$jrok_host_cache_off$jrok_ip_cache_off" $jrok_cache_off {
        "00" 0;
        default 1;
    }
}
