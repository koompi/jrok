# The parts of the Ansible role's nginx.conf that vhost template v3 relies on.
http {
    proxy_cache_path /var/cache/nginx/jrok levels=1:2 keys_zone=jrok_cache:20m max_size=1g inactive=7d use_temp_path=off;
    map $upstream_http_cache_control $jrok_not_shareable {
        "~*(^|[ ,])(public|s-maxage=)" 0;
        default 1;
    }
}
