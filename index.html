:root {

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--body);
  font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.top, .main, .foot { width: 100%; max-width: 640px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
.top { padding-top: 24px; }
.brand { display: inline-block; border-radius: 6px; }
.logo { display: block; height: 28px; width: auto; }
.lm { fill: var(--lm); } .lw { fill: var(--lw); }
.main { flex: 1; display: grid; gap: 32px; align-content: center; padding-top: 32px; padding-bottom: 40px; }
.art { border-radius: 28px; overflow: hidden; background: var(--sky); box-shadow: 0 0 0 1px var(--line); }
.art svg { display: block; width: 100%; height: auto; }
.copy { max-width: 560px; }
.pill { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 16px; padding: 4px 12px 4px 10px; border-radius: 999px; background: var(--pill); color: var(--pill-text); font-size: 14px; font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
h1 { margin: 0; color: var(--text); font: 600 clamp(1.9rem, 1.25rem + 2.4vw, 2.75rem)/1.08 var(--display); letter-spacing: -.025em; text-wrap: balance; }
.host { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; margin: 18px 0 0; padding: 7px 14px 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); font-size: 16px; font-weight: 600; line-height: 1.35; }
.host svg { flex: none; color: var(--muted); }
.host span { overflow-wrap: anywhere; }
.lead { margin: 18px 0 0; font-size: 17px; text-wrap: pretty; }
.km { margin: 10px 0 0; color: var(--muted); font: 400 15px/1.9 var(--khmer); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; margin-top: 28px; }
.btn { height: 46px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font: 600 15px var(--sans); cursor: pointer; transition: background-color .15s; }
.btn:hover { background: var(--accent-hover); }
.btn:disabled { cursor: progress; opacity: .75; }
.btn:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.auto { display: grid; gap: 7px; min-width: 190px; }
.auto p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.track { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar { width: 0; height: 100%; border-radius: 2px; background: var(--accent); transition: width 1s linear; }
.auto.done .track { display: none; }
.help { margin-top: 32px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); font-size: 15px; }
.help p { margin: 0; }
.help strong { color: var(--text); font-weight: 600; }
.help ul { margin: 8px 0 0; padding: 0 0 0 20px; }
.help li { margin-top: 4px; padding-left: 2px; }
.help li::marker { color: var(--accent); }
.help a { color: var(--link); font-weight: 500; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.help a:hover { text-decoration-thickness: 2px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.foot { padding-top: 8px; padding-bottom: 24px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; text-align: center; }
@media (min-width: 880px) {
  .top, .main, .foot { max-width: 1080px; }
  .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 64px; align-items: center; }
  .art { order: 2; }
  .foot { text-align: left; }
}
@media (max-width: 480px) {
  .top, .main, .foot { padding-left: 16px; padding-right: 16px; }
  .top { padding-top: 18px; }
  .logo { height: 24px; }
  .main { padding-top: 20px; gap: 24px; }
  .art { border-radius: 22px; }
  .btn { flex: 1 1 100%; }
  .auto { flex: 1 1 100%; }
}
/* the pictures (scenes/*.svg) */
.sky { fill: var(--sky); } .sun { fill: var(--sun); } .cloud { fill: var(--cloud); }

.foam { fill: none; stroke: var(--foam); stroke-width: 3; stroke-linecap: round; }
.sand { fill: var(--sand); } .sand2 { fill: var(--sand2); }
.weed { fill: none; stroke: var(--weed); stroke-width: 7; stroke-linecap: round; }
.dol { fill: var(--dol); } .dol2 { fill: var(--dol2); } .ink { fill: var(--ink); } .white { fill: var(--white); }
.smile { fill: none; stroke: var(--ink); stroke-width: 2.9; stroke-linecap: round; }
.cable { fill: none; stroke: var(--cable); stroke-width: 4; stroke-linecap: round; } .pole { fill: var(--cable); }
.box { fill: var(--box); } .box2 { fill: var(--box2); } .metal { fill: var(--metal); } .metal2 { fill: var(--metal2); }
.vent { fill: none; stroke: var(--box); stroke-width: 3; stroke-linecap: round; }
.tick { fill: none; stroke: var(--metal2); stroke-width: 3; stroke-linecap: round; }
.ok { fill: var(--ok); } .warn { fill: var(--warn); } .hat { fill: var(--hat); } .hat2 { fill: var(--hat2); } .cone { fill: var(--cone); }
.glass { fill: var(--glass); opacity: .9; } .ray { fill: #fff; opacity: var(--ray); } .star { fill: #fff; opacity: var(--night); }
.bub { fill: none; stroke: var(--foam); stroke-width: 2; }

<script data-retry="{{RETRY}}" data-stop="{{STOP}}">
  // Check whether the app is back, waiting a little longer each time
  // (data-retry: seconds, the last repeating), never while the tab is hidden,
  // and give up after data-stop seconds. A check is a HEAD of this address
  // that jrok answers like this page while the app is away (X-Jrok-Page-Check);
  // any other answer means the app is back, and the page reloads into it.
  // The count carries over a reload within two minutes, so an app that keeps
  // dropping out isn't checked ever faster.
  (function () {
    var d = document, s = d.currentScript, $ = function (id) { return d.getElementById(id); };
    var btn = $("retry"), auto = $("auto"), count = $("count"), bar = $("bar"), live = $("live");
    var key = "kc-wait:" + location.host;
    function forget() { try { sessionStorage.removeItem(key); } catch (e) {} }
    btn.addEventListener("click", function () { forget(); btn.disabled = true; btn.textContent = "Trying…"; location.reload(); });
    var waits = (s.getAttribute("data-retry") || "").split(",").map(Number).filter(function (n) { return n > 0; });
    var stop = (Number(s.getAttribute("data-stop")) || 600) * 1000;
    if (!waits.length || !window.fetch) return;
    var now = Date.now(), state = { t: now, n: 0, at: now };
    try {
      var last = JSON.parse(sessionStorage.getItem(key) || "null");
      if (last && now - last.at < 120000) state = last;
    } catch (e) {}
    function save() { state.at = Date.now(); try { sessionStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }
    var left = 0, total = 0, timer;
    function say(text) { live.textContent = text; }
    function draw() {
      count.textContent = "Checking again in " + left + " s";
      bar.style.width = Math.round(100 * (total - left) / total) + "%";
    }
    function plan() {
      if (Date.now() - state.t >= stop) return giveUp();
      total = left = waits[Math.min(state.n, waits.length - 1)];
      draw();
      say("Checking again in " + left + " seconds.");
    }
    function giveUp() {
      clearInterval(timer);
      auto.className += " done";
      count.textContent = "Still not back, so we stopped checking. Try again in a little while.";
      say(count.textContent);
    }
    function check() {
      left = 0;
      count.textContent = "Checking…";
      state.n += 1;
      save();
      var ctl = window.AbortController ? new AbortController() : null;
      var limit = setTimeout(function () { if (ctl) ctl.abort(); }, 30000);
      var headers = {}; headers["X-Jrok-Page-Check"] = "1";
      fetch(location.href, { method: "HEAD", cache: "no-store", redirect: "manual", headers: headers, signal: ctl ? ctl.signal : undefined })
        .then(function (r) { return r.type === "opaqueredirect" || [429, 502, 503, 504].indexOf(r.status) < 0; }, function () { return false; })
        .then(function (back) {
          clearTimeout(limit);
          if (!back) return plan();
          clearInterval(timer);
          count.textContent = "It’s back. Opening…";
          say("The app is back. Opening it now.");
          location.reload();
        });
    }
    function tick() {
      if (d.hidden || left <= 0) return;
      left -= 1;
      if (left > 0) draw(); else check();
    }
    auto.hidden = false;
    timer = setInterval(tick, 1000);
    plan();
  })();
</script>
