---
# Ansible Playbook: Setup jrok on DigitalOcean VPS
# Usage: ansible-playbook -i inventory.ini playbook.yml
# Or with tags: ansible-playbook -i inventory.ini playbook.yml --tags "docker"

- name: Setup jrok VPS servers
  hosts: jrok_servers
  become: yes
  # One edge at a time: each is restarted and passes its health check before
  # the next is touched, so the others keep serving (and nginx's fallback to a
  # peer has a live peer). Deploying all at once left an edge with no live
  # jrok for seconds on staging. jrok_serial=100% (all at once) for a first build.
  serial: "{{ jrok_serial | default(1) }}"
  vars:
    # Change these to match your setup
    docker_version: "24.0"
    # Let's Encrypt sends expiry notices here. Leave CERTBOT_EMAIL unset to
    # register without one, as production did (it refuses example.com).
    certbot_email: "{{ lookup('env', 'CERTBOT_EMAIL') }}"
    cloudflare_token: "{{ lookup('env', 'CLOUDFLARE_TOKEN') }}"
    mongodb_uri: "{{ lookup('env', 'MONGODB_URI') }}"
    cert_sync_api_key: "{{ lookup('env', 'CERT_SYNC_API_KEY') }}"
    # jrok refuses to start in production with a JWT_SECRET shorter than 32 characters.
    jwt_secret: "{{ lookup('env', 'JWT_SECRET') }}"
    koompi_client_id: "{{ lookup('env', 'KOOMPI_CLIENT_ID') }}"
    koompi_client_secret: "{{ lookup('env', 'KOOMPI_CLIENT_SECRET') }}"
    koompi_redirect_uri: "{{ lookup('env', 'KOOMPI_REDIRECT_URI') }}"
    dashboard_url: "{{ lookup('env', 'DASHBOARD_URL') }}"
    # Base domains this server answers for, primary first. Set base_domains in
    # the inventory as a comma-separated string
    # ("public.koompi.cloud,tunnel.koompi.cloud"); it defaults to domain_name.
    # The first is jrok's BASE_DOMAIN, the rest LEGACY_BASE_DOMAINS. One
    # wildcard certificate covers them all; ssl_cert_name names it (defaults to
    # the first base domain).
    jrok_base_domains: "{{ (base_domains | default(domain_name)).split(',') | map('trim') | list }}"
    jrok_ssl_cert_name: "{{ ssl_cert_name | default(jrok_base_domains[0]) }}"

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: ["always"]

    - name: Install basic packages
      apt:
        name:
          - curl
          - wget
          - git
          - jq
          - openssl
          - ufw
          - python3-pip
        state: present
      tags: ["basic"]

  roles:
    - certbot
    - nginx
    - app

  post_tasks:
    - name: Setup firewall (UFW) - Standard ports
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"
      tags: ["firewall"]

    # jrok's own port (3000) is reached by nginx (whose upstream lists every
    # server's ansible_host:3000) and by peer jrok servers forwarding
    # cross-server traffic. Nothing else should reach it: jrok believes the
    # X-Forwarded-For entry nginx appends, and a caller that skips nginx can
    # write that entry itself (bypassing IP allowlists, IP blocks and the auth
    # rate limiter). Loopback is not filtered by UFW.
    #
    # Add sources (e.g. a peer's public IP when ansible_host is a private one)
    # with jrok_port_extra_sources, or set jrok_port_public=true to keep the old
    # open-to-all rule.
    - name: Setup firewall (UFW) - jrok port from jrok servers only
      ufw:
        rule: allow
        port: "3000"
        proto: tcp
        from_ip: "{{ item }}"
      loop: "{{ (groups['jrok_servers'] | map('extract', hostvars, 'ansible_host') | list) + (jrok_port_extra_sources | default([])) }}"
      tags: ["firewall"]

    - name: Setup firewall (UFW) - remove the old open-to-all jrok port rule
      ufw:
        rule: allow
        port: "3000"
        proto: tcp
        delete: yes
      when: not (jrok_port_public | default(false) | bool)
      tags: ["firewall"]

    - name: Setup firewall (UFW) - jrok port open to all (jrok_port_public=true)
      ufw:
        rule: allow
        port: "3000"
        proto: tcp
      when: jrok_port_public | default(false) | bool
      tags: ["firewall"]

    - name: Setup firewall (UFW) - TCP tunnel port range
      ufw:
        rule: allow
        port: "{{ tcp_port_min | default('10000') }}:{{ tcp_port_max | default('20000') }}"
        proto: tcp
      tags: ["firewall"]

    - name: Enable UFW
      ufw:
        state: enabled
      tags: ["firewall"]

    - name: Verify services are running
      shell: |
        systemctl status jrok --no-pager
      register: service_status
      tags: ["verify"]
      ignore_errors: yes

    - name: Show running services
      debug:
        msg: "{{ service_status.stdout_lines }}"
      tags: ["verify"]

    - name: Show access URL
      debug:
        msg: |
          ✅ Setup Complete!
          
          Server ID: {{ vps_id | default(ansible_hostname) }}
          Region: {{ vps_region | default('default') }}
          
          Access your service at:
          - https://{{ domain_name }}
          - http://localhost:3000 (direct, on the server; port 3000 only accepts jrok servers)
          
          TCP Tunnels:
          - Port range: {{ tcp_port_min | default('10000') }}-{{ tcp_port_max | default('20000') }}
          - Use --tcp flag with CLI for TCP tunnels (SSH, MongoDB, etc.)
          
          SSH into server:
          - ssh ubuntu@{{ inventory_hostname }}
          
          Check logs:
          - journalctl -u jrok -f
          
          Certificate status:
          - sudo certbot certificates
          
          Renew certificate:
          - sudo certbot renew --dry-run
      tags: ["info"]
