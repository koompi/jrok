---
# Ansible Playbook: Setup jrok on DigitalOcean VPS
# Usage: ansible-playbook -i inventory.ini playbook.yml
# Or with tags: ansible-playbook -i inventory.ini playbook.yml --tags "docker"

- name: Setup jrok VPS servers
  hosts: jrok_servers
  become: yes
  # One edge at a time: each is restarted and passes its health check before
  # the next is touched, so the others keep serving (and nginx's fallback to a
  # peer has a live peer). Deploying all at once left an edge with no live
  # jrok for seconds on staging. jrok_serial=100% (all at once) for a first build.
  serial: "{{ jrok_serial | default(1) }}"
  vars:
    # Change these to match your setup
    docker_version: "24.0"
    # Let's Encrypt sends expiry notices here. Leave CERTBOT_EMAIL unset to
    # register without one, as production did (it refuses example.com).
    certbot_email: "{{ lookup('env', 'CERTBOT_EMAIL') }}"
    cloudflare_token: "{{ lookup('env', 'CLOUDFLARE_TOKEN') }}"
    # MaxMind GeoLite2 (visitor location); unset skips the geoip role.
    maxmind_account_id: "{{ lookup('env', 'MAXMIND_ACCOUNT_ID') }}"
    maxmind_license_key: "{{ lookup('env', 'MAXMIND_LICENSE_KEY') }}"
    # Alerts (edge out of / back in DNS, a deploy stopped); unset: none.
    telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
    telegram_chat_id: "{{ lookup('env', 'TELEGRAM_CHAT_ID') }}"
    mongodb_uri: "{{ lookup('env', 'MONGODB_URI') }}"
    cert_sync_api_key: "{{ lookup('env', 'CERT_SYNC_API_KEY') }}"
    # jrok refuses to start in production with a JWT_SECRET shorter than 32 characters.
    jwt_secret: "{{ lookup('env', 'JWT_SECRET') }}"
    koompi_client_id: "{{ lookup('env', 'KOOMPI_CLIENT_ID') }}"
    koompi_client_secret: "{{ lookup('env', 'KOOMPI_CLIENT_SECRET') }}"
    koompi_redirect_uri: "{{ lookup('env', 'KOOMPI_REDIRECT_URI') }}"
    dashboard_url: "{{ lookup('env', 'DASHBOARD_URL') }}"
    # Base domains this server answers for, primary first. Set base_domains in
    # the inventory as a comma-separated string
    # ("public.koompi.cloud,tunnel.koompi.cloud"); it defaults to domain_name.
    # The first is jrok's BASE_DOMAIN, the rest LEGACY_BASE_DOMAINS. One
    # wildcard certificate covers them all; ssl_cert_name names it (defaults to
    # the first base domain).
    jrok_base_domains: "{{ (base_domains | default(domain_name)).split(',') | map('trim') | list }}"
    jrok_ssl_cert_name: "{{ ssl_cert_name | default(jrok_base_domains[0]) }}"
    # The edge that issues and renews that certificate (cert_renewer, an
    # inventory name; default the first edge). Let's Encrypt issues at most 5
    # certificates a week for the same names, so the others don't issue their
    # own: they take a copy and then follow MongoDB (roles/certbot).
    jrok_cert_renewer: "{{ cert_renewer | default(groups['jrok_servers'][0]) }}"
    # Edges reach each other over HTTPS (P10, src/utils/peerLink.ts) once every
    # edge has a forward_host: its own name, an A record for that edge alone and
    # covered by the wildcard certificate (e.g. "edge-a.public.koompi.cloud").
    # Requests between edges carry JROK_PEER_KEY (`openssl rand -hex 32`, the
    # same on every edge), and jrok's port is then closed to the other edges.
    jrok_peer_key: "{{ lookup('env', 'JROK_PEER_KEY') }}"
    # Encrypts certificate private keys in MongoDB (`openssl rand -hex 32`, the
    # same on every edge, never changed once set). Unset: stored unencrypted.
    cert_encryption_key: "{{ lookup('env', 'JROK_CERT_KEY') }}"
    jrok_peer_tls: "{{ groups['jrok_servers'] | length > 1 and groups['jrok_servers'] | map('extract', hostvars) | selectattr('forward_host', 'defined') | list | length == groups['jrok_servers'] | length }}"
    # The name nginx's fallback presents to every peer (TLS and Host). Every
    # edge answers to it; it needs no DNS record.
    jrok_peer_name: "{{ peer_name | default('jrok-peer.' ~ jrok_base_domains[0]) }}"
    jrok_peer_gateway_port: 3001
    # Addresses other edges connect from: their ansible_host, plus extras.
    jrok_peer_sources: "{{ (groups['jrok_servers'] | map('extract', hostvars, 'ansible_host') | list) + (jrok_port_extra_sources | default([])) }}"

  pre_tasks:
    - name: Edges reaching each other over HTTPS need the peer key
      assert:
        that:
          - jrok_peer_key | length >= 32
          - jrok_peer_key is match('^[A-Za-z0-9_-]+$')
        fail_msg: "Every edge has a forward_host: set JROK_PEER_KEY (openssl rand -hex 32), the same for every edge"
        quiet: true
      when: jrok_peer_tls | bool
      tags: ["always"]

    - name: A certificate key, when given, is long enough
      assert:
        that:
          - cert_encryption_key | length >= 32
          - cert_encryption_key is match('^[A-Za-z0-9_+/=-]+$')
        fail_msg: "JROK_CERT_KEY must be at least 32 characters (openssl rand -hex 32), the same for every edge"
        quiet: true
      when: cert_encryption_key | length > 0
      tags: ["always"]

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: ["always"]

    - name: Install basic packages
      apt:
        name:
          - curl
          - wget
          - git
          - jq
          - openssl
          - ufw
          - python3-pip
        state: present
      tags: ["basic"]

    # Small edges (1 GB, like the original) get swap for short spikes; RAM is
    # still preferred (swappiness 10). swap_size: "0" for none.
    - name: Swap file on edges with under 3 GB of RAM (swap_size, default 2G)
      shell: |
        set -e
        if [ "$(swapon --show --noheadings | wc -l)" -eq 0 ]; then
          fallocate -l {{ swap_size | default('2G') }} /swapfile
          chmod 600 /swapfile
          mkswap /swapfile > /dev/null
          swapon /swapfile
          grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
          echo created
        fi
      args:
        executable: /bin/bash
      register: swap_result
      changed_when: "'created' in swap_result.stdout"
      when: ansible_memtotal_mb < 3000 and (swap_size | default('2G') | string) != '0'
      tags: ["basic"]

    - name: Prefer RAM over swap
      sysctl:
        name: vm.swappiness
        value: "10"
        state: present
        sysctl_set: true
      when: ansible_memtotal_mb < 3000
      tags: ["basic"]

  roles:
    - certbot
    - nginx
    - geoip
    - app

  post_tasks:
    - name: Setup firewall (UFW) - Standard ports
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"
      tags: ["firewall"]

    # jrok's own port (3000) is reached by nginx (whose upstream lists every
    # server's ansible_host:3000) and by peer jrok servers forwarding
    # cross-server traffic. Nothing else should reach it: jrok believes the
    # X-Forwarded-For entry nginx appends, and a caller that skips nginx can
    # write that entry itself (bypassing IP allowlists, IP blocks and the auth
    # rate limiter). Loopback is not filtered by UFW.
    #
    # Add sources (e.g. a peer's public IP when ansible_host is a private one)
    # with jrok_port_extra_sources, or set jrok_port_public=true to keep the old
    # open-to-all rule.
    #
    # With jrok_peer_tls the edges reach each other through nginx on 443
    # instead, so these rules are removed. (Switching an existing multi-edge
    # setup over: an edge not yet redeployed still forwards to port 3000 for
    # the minute or so until it is.)
    - name: Setup firewall (UFW) - jrok port from jrok servers only (removed with jrok_peer_tls)
      ufw:
        rule: allow
        port: "3000"
        proto: tcp
        from_ip: "{{ item }}"
        delete: "{{ jrok_peer_tls | bool }}"
      loop: "{{ jrok_peer_sources }}"
      tags: ["firewall"]

    - name: Setup firewall (UFW) - remove the old open-to-all jrok port rule
      ufw:
        rule: allow
        port: "3000"
        proto: tcp
        delete: yes
      when: not (jrok_port_public | default(false) | bool)
      tags: ["firewall"]

    - name: Setup firewall (UFW) - jrok port open to all (jrok_port_public=true)
      ufw:
        rule: allow
        port: "3000"
        proto: tcp
      when: jrok_port_public | default(false) | bool
      tags: ["firewall"]

    - name: Setup firewall (UFW) - TCP tunnel port range
      ufw:
        rule: allow
        port: "{{ tcp_port_min | default('10000') }}:{{ tcp_port_max | default('20000') }}"
        proto: tcp
      tags: ["firewall"]

    - name: Enable UFW
      ufw:
        state: enabled
      tags: ["firewall"]

    - name: Verify services are running
      shell: |
        systemctl status jrok --no-pager
      register: service_status
      tags: ["verify"]
      ignore_errors: yes

    - name: Show running services
      debug:
        msg: "{{ service_status.stdout_lines }}"
      tags: ["verify"]

    - name: Show access URL
      debug:
        msg: |
          ✅ Setup Complete!
          
          Server ID: {{ vps_id | default(ansible_hostname) }}
          Region: {{ vps_region | default('default') }}
          
          Access your service at:
          - https://{{ domain_name }}
          - http://localhost:3000 (direct, on the server; port 3000 only accepts jrok servers)
          
          TCP Tunnels:
          - Port range: {{ tcp_port_min | default('10000') }}-{{ tcp_port_max | default('20000') }}
          - Use --tcp flag with CLI for TCP tunnels (SSH, MongoDB, etc.)
          
          SSH into server:
          - ssh ubuntu@{{ inventory_hostname }}
          
          Check logs:
          - journalctl -u jrok -f
          
          Certificate status:
          - sudo certbot certificates
          
          Renew certificate:
          - sudo certbot renew --dry-run
      tags: ["info"]
