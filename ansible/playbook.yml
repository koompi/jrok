---
# Ansible Playbook: Setup kproxy on DigitalOcean VPS
# Usage: ansible-playbook -i inventory.ini playbook.yml
# Or with tags: ansible-playbook -i inventory.ini playbook.yml --tags "docker"
#
# TLS is handled by Cloudflare at the edge (no nginx/certbot on the host).
# Customer custom domains use Cloudflare for SaaS custom hostnames; Cloudflare
# auto-issues and auto-renews the edge certificate.

- name: Setup kproxy VPS servers
  hosts: jrok_servers
  become: yes
  vars:
    # Change these to match your setup
    docker_version: "24.0"
    mongodb_uri: "{{ lookup('env', 'MONGODB_URI') }}"
    koompi_client_id: "{{ lookup('env', 'KOOMPI_CLIENT_ID') }}"
    koompi_client_secret: "{{ lookup('env', 'KOOMPI_CLIENT_SECRET') }}"
    koompi_redirect_uri: "{{ lookup('env', 'KOOMPI_REDIRECT_URI') }}"
    dashboard_url: "{{ lookup('env', 'DASHBOARD_URL') }}"
    # Cloudflare for SaaS (edge TLS + custom hostnames) — consumed by the app systemd env
    cf_api_token: "{{ lookup('env', 'CF_API_TOKEN') }}"
    cf_zone_id: "{{ lookup('env', 'CF_ZONE_ID') }}"
    cf_saas_fallback_hostname: "{{ lookup('env', 'CF_SAAS_FALLBACK_HOSTNAME') }}"
    # Gossip mesh shared secret — consumed by the app systemd env
    gossip_secret: "{{ lookup('env', 'GOSSIP_SECRET') }}"
    # JWT signing secret (>=32 chars) — REQUIRED in production or the node refuses to boot
    jwt_secret: "{{ lookup('env', 'JWT_SECRET') }}"

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: ["always"]

    - name: Install basic packages
      apt:
        name:
          - curl
          - wget
          - git
          - jq
          - openssl
          - ufw
          - python3-pip
        state: present
      tags: ["basic"]

  roles:
    - docker
    - app

  post_tasks:
    - name: Setup firewall (UFW) - Standard ports
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"
        - "3000"
      tags: ["firewall"]

    - name: Setup firewall (UFW) - TCP tunnel port range
      ufw:
        rule: allow
        port: "{{ tcp_port_min | default('10000') }}:{{ tcp_port_max | default('20000') }}"
        proto: tcp
      tags: ["firewall"]

    - name: Enable UFW
      ufw:
        state: enabled
      tags: ["firewall"]

    - name: Verify services are running
      shell: |
        systemctl status kproxy --no-pager
      register: service_status
      tags: ["verify"]
      ignore_errors: yes

    - name: Show running services
      debug:
        msg: "{{ service_status.stdout_lines }}"
      tags: ["verify"]

    - name: Show access URL
      debug:
        msg: |
          ✅ Setup Complete!

          Server ID: {{ vps_id | default(ansible_hostname) }}
          Region: {{ vps_region | default('default') }}

          Access your service at:
          - https://{{ domain_name }}
          - http://{{ inventory_hostname }}:3000 (direct)

          TCP Tunnels:
          - Port range: {{ tcp_port_min | default('10000') }}-{{ tcp_port_max | default('20000') }}
          - Use --tcp flag with CLI for TCP tunnels (SSH, MongoDB, etc.)

          SSH into server:
          - ssh ubuntu@{{ inventory_hostname }}

          Check logs:
          - journalctl -u kproxy -f

          TLS / certificates:
          - Public TLS is handled by Cloudflare at the edge (no certbot on host).
          - Customer custom domains are issued automatically via Cloudflare for SaaS
            custom hostnames (CNAME, DNS-only, to {{ cf_saas_fallback_hostname | default('CF_SAAS_FALLBACK_HOSTNAME') }}).
      tags: ["info"]
