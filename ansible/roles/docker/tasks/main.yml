---
# Ansible Role: Install and configure Docker

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  tags: ["docker"]

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  tags: ["docker"]

- name: Install Docker and related packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  tags: ["docker"]

- name: Install Docker Compose standalone
  get_url:
    url: "https://github.com/docker/compose/releases/latest/download/docker-compose-{{ ansible_system }}-{{ ansible_machine }}"
    dest: /usr/local/bin/docker-compose
    mode: '0755'
  tags: ["docker"]

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes
  tags: ["docker"]

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
  tags: ["docker"]

- name: Verify Docker installation
  shell: docker --version && docker-compose --version
  register: docker_version_check
  tags: ["docker"]

- name: Show Docker version
  debug:
    msg: "{{ docker_version_check.stdout }}"
  tags: ["docker"]
