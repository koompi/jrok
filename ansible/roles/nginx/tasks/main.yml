---
# Ansible Role: Install and configure Nginx reverse proxy

- name: Install Nginx with stream module
  apt:
    name: 
      - nginx
      - libnginx-mod-stream
    state: present
  tags: ["nginx"]

- name: Create nginx directories for custom domain configs
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
    - /etc/nginx/conf.d
  tags: ["nginx"]

- name: Create Nginx configuration
  copy:
    content: |
      user www-data;
      worker_processes auto;
      worker_rlimit_nofile 8192;
      pid /run/nginx.pid;
      error_log /var/log/nginx/error.log warn;
      
      # Load stream module for TCP tunneling
      load_module /usr/lib/nginx/modules/ngx_stream_module.so;
      
      events {
        worker_connections 4096;
        use epoll;
      }
      
      # ============ TCP/UDP Stream Configuration (for TCP tunnels) ============
      # TCP tunnels are dynamically managed by jrok server on ports 10000-20000
      # The jrok server handles TCP port allocation and direct socket forwarding
      # Nginx stream is optional - only needed if you want Nginx to proxy TCP
      stream {
        log_format tcp_log '$remote_addr [$time_local] '
                           '$protocol $status $bytes_sent $bytes_received '
                           '$session_time';
        
        access_log /var/log/nginx/tcp_access.log tcp_log;
        
        # TCP tunnel upstream - jrok server handles dynamic port mapping
        # Ports 10000-20000 are reserved for TCP tunnels
        # Each TCP tunnel gets a unique port that forwards to the agent
        
        # Example: If you want Nginx to proxy a specific TCP port range
        # Uncomment and modify as needed:
        # server {
        #     listen 10001;
        #     proxy_pass 127.0.0.1:10001;
        #     proxy_timeout 600s;
        #     proxy_connect_timeout 10s;
        # }
      }
      
      http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Include custom domain configurations (generated by jrok server)
        include /etc/nginx/sites-enabled/*.conf;
        include /etc/nginx/conf.d/*.conf;
        
        # Logging
        access_log /var/log/nginx/access.log combined;

        # "combined" without the query string ($uri instead of $request). Used
        # for the agent WebSocket location: jrok CLIs before header auth send
        # their API key as ?auth=, and that must not be written to disk.
        log_format combined_noquery '$remote_addr - $remote_user [$time_local] '
                                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                    '"$http_referer" "$http_user_agent"';
        
        # Performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size {{ client_max_body_size | default('10M') }};

        # Gzip compression. jrok's agent decompresses whatever the app sent
        # before it crosses the tunnel, so this is the only compression a
        # visitor gets: every text type a web app serves must be listed here.
        # (text/html is always compressed; listing it only draws a warning.)
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1000;
        gzip_types text/plain text/css text/xml text/javascript text/csv
                   application/javascript application/x-javascript
                   application/json application/ld+json application/manifest+json
                   application/xml application/xml+rss application/rss+xml application/atom+xml
                   image/svg+xml image/x-icon application/vnd.ms-fontobject font/ttf font/otf;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        
        # WebSocket upgrades. Ordinary requests get an empty Connection header,
        # which lets nginx reuse its connections to jrok (upstream keepalive);
        # "close" here used to force a new connection for every request.
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      "";
        }

        # Per-IP request limit (zone "general") for jrok's own hosts: its API
        # and the agent endpoint. App traffic (a single-label subdomain of a
        # base domain) gets an empty key, which nginx never counts: one page
        # load makes dozens of requests, and many mobile users share one IP.
        # Custom domains have their own server blocks, which set no limit.
        map $host $jrok_limit_key {
        {% for d in jrok_base_domains %}
            ~^[^.]+\.{{ d | regex_escape }}$ "";
        {% endfor %}
            default $binary_remote_addr;
        }
        limit_req_zone $jrok_limit_key zone=general:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=strict:10m rate=5r/s;

        # This server's own jrok. Each edge's nginx sends to its local jrok,
        # which forwards to whichever edge holds an app's tunnel. The other
        # edges are backups, used only while the local jrok is down, so its
        # visitors are served by a peer instead of getting 502 (P15). (Listing
        # every server as a regular member, as this template once did, made
        # two hops for most requests.)
        upstream jrok {
          server 127.0.0.1:{{ jrok_port | default('3000') }} max_fails=3 fail_timeout=30s;
          {% for h in groups['jrok_servers'] | default([]) if h != inventory_hostname %}
          server {{ hostvars[h].jrok_peer_address | default(hostvars[h].ansible_host) }}:{{ jrok_port | default('3000') }} backup;
          {% endfor %}
          keepalive 64;
        }

        # Redirect HTTP to HTTPS
        server {
          listen 80;
          server_name {% for d in jrok_base_domains %}{{ d }} *.{{ d }} {% endfor %};

          location /.well-known/acme-challenge/ {
            root /var/www/certbot;
          }

          location / {
            return 301 https://$host$request_uri;
          }
        }

        # HTTPS server
        server {
          listen 443 ssl http2;
          server_name {% for d in jrok_base_domains %}{{ d }} *.{{ d }} {% endfor %};

          # One wildcard certificate covers every base domain.
          ssl_certificate /etc/letsencrypt/live/{{ jrok_ssl_cert_name }}/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/{{ jrok_ssl_cert_name }}/privkey.pem;

          # SSL configuration
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers HIGH:!aNULL:!MD5;
          ssl_prefer_server_ciphers on;
          ssl_session_cache shared:SSL:10m;
          ssl_session_timeout 10m;
          
          # Rate limiting: jrok's own hosts only (see $jrok_limit_key)
          limit_req zone=general burst=20 nodelay;

          # WebSocket support for agents
          location /ws/ {
            # No query strings in this log: old agents put their API key there.
            access_log /var/log/nginx/access.log combined_noquery;

            proxy_pass http://jrok;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Long timeout for WebSockets
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
          }

          # Proxy settings
          location / {
            proxy_pass http://jrok;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts. The read timeout is the longest quiet gap nginx allows,
            # so a visitor's idle WebSocket survives an hour. Plain HTTP is cut
            # off sooner by jrok itself (TUNNEL_REQUEST_TIMEOUT_MS to first byte).
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
          }
          
          # Health check endpoint
          location /health {
            proxy_pass http://jrok/health;
            access_log off;
          }
          
          # API endpoints - stricter rate limiting
          location /certificates/ {
            limit_req zone=strict burst=5 nodelay;
            proxy_pass http://jrok;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
          }
        }
      }
    dest: /etc/nginx/nginx.conf
    backup: yes
    # Never install a config nginx would reject (every include path is absolute).
    validate: nginx -t -c %s
  register: nginx_conf
  tags: ["nginx"]

- name: Test Nginx configuration
  shell: nginx -t
  register: nginx_test
  tags: ["nginx"]

- name: Show Nginx test result
  debug:
    msg: "{{ nginx_test.stdout }}"
  tags: ["nginx"]

- name: Start and enable Nginx service
  systemd:
    name: nginx
    state: started
    enabled: yes
    daemon_reload: yes
  tags: ["nginx"]

- name: Reload Nginx so a changed configuration takes effect
  # "started" leaves a running nginx alone, including the one apt started with
  # its default config, so without this the file above never went live.
  systemd:
    name: nginx
    state: reloaded
  when: nginx_conf.changed
  tags: ["nginx"]

- name: Verify Nginx is running
  shell: systemctl status nginx | head -10
  register: nginx_status
  tags: ["nginx"]

- name: Show Nginx status
  debug:
    msg: "{{ nginx_status.stdout }}"
  tags: ["nginx"]
