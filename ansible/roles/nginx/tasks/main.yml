---
# Ansible Role: Install and configure Nginx reverse proxy

- name: Install Nginx with stream module
  apt:
    name: 
      - nginx
      - libnginx-mod-stream
    state: present
  tags: ["nginx"]

- name: Create nginx directories for custom domain configs
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
    - /etc/nginx/conf.d
  tags: ["nginx"]

- name: Create the edge cache directory (proxy_cache_path in nginx.conf)
  file:
    path: /var/cache/nginx/jrok
    state: directory
    owner: www-data
    group: root
    mode: '0700'
  tags: ["nginx"]

# jrok keeps these (src/services/edgeCacheRules.ts): the hosts and addresses
# the edge cache leaves to it. nginx.conf includes them, so they must exist
# before it is written; jrok's content is never overwritten here.
- name: Edge cache rules jrok keeps (empty until it writes them)
  copy:
    content: "# Written by jrok (src/services/edgeCacheRules.ts) whenever the rules change. Edits here are lost.\n"
    dest: "{{ item }}"
    force: no
    owner: root
    group: root
    mode: '0644'
  loop:
    - /etc/nginx/jrok-cache-off.map
    - /etc/nginx/jrok-blocked-ips.geo
  tags: ["nginx"]

- name: Edge-to-edge key for nginx's fallback to other edges (jrok_peer_tls)
  # Only the master process reads configuration, as root.
  copy:
    content: |
      proxy_set_header X-Jrok-Peer-Key "{{ jrok_peer_key }}";
    dest: /etc/nginx/jrok-peer-key.conf
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: jrok_peer_tls | bool
  tags: ["nginx"]

- name: Create Nginx configuration
  copy:
    content: |
      user www-data;
      worker_processes auto;
      worker_rlimit_nofile {{ nginx_worker_rlimit_nofile | default(65536) }};
      pid /run/nginx.pid;
      error_log /var/log/nginx/error.log warn;
      
      # Load stream module for TCP tunneling
      load_module /usr/lib/nginx/modules/ngx_stream_module.so;
      
      events {
        # Each proxied request holds two (visitor and jrok); with 4096, two
        # addresses at the per-address limit (jrok_conn_per_ip) filled an edge.
        worker_connections {{ nginx_worker_connections | default(16384) }};
        use epoll;
      }
      
      # ============ TCP/UDP Stream Configuration (for TCP tunnels) ============
      # TCP tunnels are dynamically managed by jrok server on ports 10000-20000
      # The jrok server handles TCP port allocation and direct socket forwarding
      # Nginx stream is optional - only needed if you want Nginx to proxy TCP
      stream {
        log_format tcp_log '$remote_addr [$time_local] '
                           '$protocol $status $bytes_sent $bytes_received '
                           '$session_time';
        
        access_log /var/log/nginx/tcp_access.log tcp_log;
        
        # TCP tunnel upstream - jrok server handles dynamic port mapping
        # Ports 10000-20000 are reserved for TCP tunnels
        # Each TCP tunnel gets a unique port that forwards to the agent
        
        # Example: If you want Nginx to proxy a specific TCP port range
        # Uncomment and modify as needed:
        # server {
        #     listen 10001;
        #     proxy_pass 127.0.0.1:10001;
        #     proxy_timeout 600s;
        #     proxy_connect_timeout 10s;
        # }
      }
      
      http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Include custom domain configurations (generated by jrok server)
        include /etc/nginx/sites-enabled/*.conf;
        include /etc/nginx/conf.d/*.conf;
        
        # Logging
        access_log /var/log/nginx/access.log combined;

        # "combined" without the query string ($uri instead of $request). Used
        # for the agent WebSocket location: jrok CLIs before header auth send
        # their API key as ?auth=, and that must not be written to disk.
        log_format combined_noquery '$remote_addr - $remote_user [$time_local] '
                                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                    '"$http_referer" "$http_user_agent"';
        
        # Performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        # No nginx version in headers and error pages.
        server_tokens off;
        client_max_body_size {{ client_max_body_size | default('10M') }};

        # Slow clients (attacks that hold connections open by sending a byte
        # now and then): headers within 15 s, and no 30 s gap while sending a
        # body (nginx's defaults are 60 s each). Timed-out connections are
        # reset at once instead of lingering.
        client_header_timeout 15s;
        client_body_timeout 30s;
        reset_timedout_connection on;

        # Gzip compression. jrok's agent decompresses whatever the app sent
        # before it crosses the tunnel, so this is the only compression a
        # visitor gets: every text type a web app serves must be listed here.
        # (text/html is always compressed; listing it only draws a warning.)
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1000;
        gzip_types text/plain text/css text/xml text/javascript text/csv
                   application/javascript application/x-javascript
                   application/json application/ld+json application/manifest+json
                   application/xml application/xml+rss application/rss+xml application/atom+xml
                   image/svg+xml image/x-icon application/vnd.ms-fontobject font/ttf font/otf;

        # Edge cache (plan Phase 0.5.1): a response the app marks as shareable
        # (Cache-Control: public or s-maxage, e.g. Next.js _next/static) is
        # served from here and never crosses the tunnel. Keyed by host, so two
        # apps' /app.js never meet. nginx itself never caches responses with
        # Set-Cookie or marked private / no-store / no-cache; requests with an
        # Authorization header are neither cached nor answered from cache.
        proxy_cache_path /var/cache/nginx/jrok levels=1:2 keys_zone=jrok_cache:20m
                         max_size={{ jrok_cache_max_size | default('1g') }} inactive=7d use_temp_path=off;
        # HTML is never kept here: a page names the app's other files, and after
        # a redeploy the old one (Next.js marks prerendered pages s-maxage=1 year)
        # kept showing the old app. Hashed files (_next/static) still are.
        map $upstream_http_content_type $jrok_is_html {
            "~*^text/html" 1;
            default 0;
        }
        # Browsers ask again each time (a 304 when nothing changed) for what the
        # app says nothing about, and for HTML it only lets shared caches keep:
        # a redeploy shows at once, with no forced refresh. What sets its own
        # max-age keeps it. Like Vercel's default for responses without one.
        map "$upstream_http_content_type|$upstream_http_cache_control" $jrok_revalidate {
            "~^[^|]*\|$" "no-cache";
            "~*^text/html[^|]*\|(?!.*max-age=)" "no-cache";
            default "";
        }
        map $upstream_http_cache_control $jrok_not_shareable {
            "~*(^|[ ,])(public|s-maxage=)" 0;
            default 1;
        }
        # Requests the cache leaves to jrok, whose checks run only when it sees
        # them: every host of an app with IP rules (an allowlist, a blocklist)
        # or a suspension, and every address blocked by hand. They are never
        # answered from the cache nor stored in it. jrok writes both files and
        # reloads nginx when they change (src/services/edgeCacheRules.ts).
        map $host $jrok_host_cache_off {
            default 0;
            include /etc/nginx/jrok-cache-off.map;
        }
        geo $jrok_ip_cache_off {
            default 0;
            include /etc/nginx/jrok-blocked-ips.geo;
        }
        map "$jrok_host_cache_off$jrok_ip_cache_off" $jrok_cache_off {
            "00" 0;
            default 1;
        }

        # Security headers. Who may show an app in a frame (frame-ancestors):
        # - a live preview (KOOMPI Cloud's Ask AI: live-<10 hex>): the dashboard,
        #   which shows it in its chat. The dashboard is at koompi.cloud, and
        #   still at kconsole.koompi.cloud: a site missing here sees "refused to
        #   connect" in the frame.
        # - any other app that says nothing about it itself (no X-Frame-Options,
        #   no frame-ancestors of its own): itself and the KOOMPI Cloud Showcase
        #   (koompi.cloud/showcase shows each listed app live in its card); no
        #   other site, against clickjacking. An app that sets either keeps its
        #   own rule: a browser ignores X-Frame-Options once a policy has
        #   frame-ancestors, so ours is never added on top of its.
        # An empty value adds no header.
        add_header Content-Security-Policy $jrok_frame_ancestors always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        # HIT / MISS / STALE … for proxied responses; absent elsewhere (an empty
        # value adds no header). Here rather than in a location: a location's
        # own add_header would drop the security headers above.
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control $jrok_revalidate;
        
        # WebSocket upgrades. Ordinary requests get an empty Connection header,
        # which lets nginx reuse its connections to jrok (upstream keepalive);
        # "close" here used to force a new connection for every request.
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      "";
        }

        # Per-IP request limit (zone "jrok_general") for jrok's own hosts: its API
        # and the agent endpoint. App traffic (a single-label subdomain of a
        # base domain) gets an empty key, which nginx never counts: one page
        # load makes dozens of requests, and many mobile users share one IP.
        # Custom domains have their own server blocks, which set no limit.
        map $host $jrok_is_live_preview {
            "~^live-[a-f0-9]{10}\." 1;
            default 0;
        }
        map $upstream_http_x_frame_options $jrok_app_frame_options {
            "" 0;
            default 1;
        }
        map $upstream_http_content_security_policy $jrok_app_frame_ancestors {
            "~*frame-ancestors" 1;
            default 0;
        }
        # live preview | app sets X-Frame-Options | app sets frame-ancestors
        map "$jrok_is_live_preview$jrok_app_frame_options$jrok_app_frame_ancestors" $jrok_frame_ancestors {
            "~^1" "frame-ancestors 'self' {{ jrok_dashboard_origins | default('https://koompi.cloud https://kconsole.koompi.cloud') }}";
            "000" "frame-ancestors 'self' {{ jrok_showcase_origins | default('https://koompi.cloud') }}";
            default "";
        }
        map $host $jrok_limit_key {
        {% for d in jrok_base_domains %}
            ~^[^.]+\.{{ d | regex_escape }}$ "";
        {% endfor %}
            default $binary_remote_addr;
        }
        # Not "general": edges built before this keyed a zone of that name by
        # $binary_remote_addr, and nginx refuses a reload that gives an
        # existing zone a new key (it keeps running the old configuration).
        limit_req_zone $jrok_limit_key zone=jrok_general:10m rate=10r/s;
        # Agent handshakes (/ws/agent) have their own limit. A worker is one IP
        # holding hundreds of agents, which all reconnect at once when an edge
        # restarts: under the general limit 300 of them took 57 s to come back
        # (staging). The burst lets a whole worker in at once; the rate still
        # bounds a flood of handshakes from one address.
        limit_req_zone $binary_remote_addr zone=agents:10m rate={{ jrok_agent_rate | default('20r/s') }};
        # jrok's certificate API (/certificates/ on a base domain itself), 5/s
        # per address. On an app's own name the path is the app's: it used to
        # match there too, and gave the app's visitors 503s. A new zone name
        # because the old "strict" one had another key (see jrok_general).
        map "$host:$uri" $jrok_strict_key {
          default "";
        {% for d in jrok_base_domains %}
          "~^{{ d | regex_escape }}:/certificates/" $binary_remote_addr;
        {% endfor %}
        }
        limit_req_zone $jrok_strict_key zone=jrok_strict:10m rate=5r/s;

        # Connections at once from one address (with HTTP/2, each request in
        # flight counts as one). One address can't use up the edge's
        # connections; a page load is 30–60 requests, so the limit is far above
        # people, even many behind one carrier address. Agents (/ws/agent: a
        # worker holds hundreds of them) and the other edges are never
        # counted. Request floods are jrok's (src/services/floodGuard.ts).
        geo $jrok_conn_exempt {
          default 0;
          127.0.0.1 1;
          {% for source in jrok_peer_sources %}
          {{ source }} 1;
          {% endfor %}
        }
        map "$jrok_conn_exempt:$uri" $jrok_conn_key {
          ~^1: "";
          ~^0:/ws/agent "";
          default $binary_remote_addr;
        }
        limit_conn_zone $jrok_conn_key zone=jrok_conn:10m;
        limit_conn jrok_conn {{ jrok_conn_per_ip | default(1000) }};
        limit_conn_status 429;
        limit_conn_log_level warn;

        # This server's own jrok. Each edge's nginx sends to its local jrok,
        # which forwards to whichever edge holds an app's tunnel. The other
        # edges are backups, used only while the local jrok is down, so its
        # visitors are served by a peer instead of getting 502 (P15). (Listing
        # every server as a regular member, as this template once did, made
        # two hops for most requests.)
        # fail_timeout is also how long a restarted local jrok is passed over:
        # keep it short so traffic returns to it within seconds.
        upstream jrok {
          server 127.0.0.1:{{ jrok_port | default('3000') }} max_fails=3 fail_timeout=5s;
          {% if jrok_peer_tls | bool %}
          # The other edges, over HTTPS (the edge-to-edge gateway below).
          server 127.0.0.1:{{ jrok_peer_gateway_port }} backup;
          {% else %}
          {% for h in groups['jrok_servers'] | default([]) if h != inventory_hostname %}
          server {{ hostvars[h].jrok_peer_address | default(hostvars[h].ansible_host) }}:{{ jrok_port | default('3000') }} backup;
          {% endfor %}
          {% endif %}
          keepalive 64;
        }

        # Agents connect to THIS edge only, never a backup. An agent pinned to
        # this edge (--edge) that reached a peer while the local jrok restarted
        # would stay there, leaving this edge without it (seen on staging).
        # Failing instead makes the agent retry until its own edge is back.
        upstream jrok_agents {
          server 127.0.0.1:{{ jrok_port | default('3000') }};
        }
        {% if jrok_peer_tls | bool %}

        # ============ Edge to edge (P10) ============
        # Edges forward to each other over HTTPS, into the entry server block
        # below, and nginx falls back to the other edges the same way. Every
        # such request carries the shared peer key; jrok checks it before
        # believing the visitor address the request carries (src/utils/peerLink.ts).

        # This edge's jrok for requests other edges send. Never a backup: a
        # forwarded request must not bounce on to yet another edge.
        upstream jrok_this_edge {
          server 127.0.0.1:{{ jrok_port | default('3000') }};
          keepalive 32;
        }

        # The other edges' entry server blocks.
        upstream jrok_peers {
          {% for h in groups['jrok_servers'] if h != inventory_hostname %}
          server {{ hostvars[h].jrok_peer_address | default(hostvars[h].ansible_host) }}:443 max_fails=1 fail_timeout=10s;
          {% endfor %}
          keepalive 16;
        }

        # Fallback gateway: upstream jrok's backup while the local jrok is down.
        # Only this nginx connects here, so X-Real-IP is the visitor its front
        # server block saw. TLS to the peer is verified against jrok_peer_name,
        # which the wildcard certificate covers.
        server {
          listen 127.0.0.1:{{ jrok_peer_gateway_port }};
          # An inner hop: the front server block adds the security headers and
          # compresses, once. Any add_header here stops the http-level ones
          # being inherited (they'd repeat); an empty one is never sent.
          add_header X-Jrok-Inner-Hop "";
          gzip off;

          location / {
            proxy_pass https://jrok_peers;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name {{ jrok_peer_name }};
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_session_reuse on;

            proxy_set_header Host {{ jrok_peer_name }};
            proxy_set_header X-Jrok-Forwarded-Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_real_ip;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            include /etc/nginx/jrok-peer-key.conf;
            # The peer's "don't buffer" (live streams), on to the front server block.
            proxy_pass_header X-Accel-Buffering;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
          }
        }
        {% endif %}

        # Redirect HTTP to HTTPS. Also the default for hosts with no server
        # block of their own, such as a custom domain this edge hasn't synced
        # yet while another edge's certbot gets its certificate.
        server {
          listen 80 default_server;
          server_name {% for d in jrok_base_domains %}{{ d }} *.{{ d }} {% endfor %};

          # Certificate challenges: jrok answers from this edge's certbot
          # webroot or another edge's (src/services/acmeChallenge.ts).
          location /.well-known/acme-challenge/ {
            proxy_pass http://jrok;
            proxy_set_header Host $host;
            proxy_set_header X-Jrok-Acme-Challenge 1;
          }

          location / {
            return 301 https://$host$request_uri;
          }
        }

        # HTTPS server. Also the default for names with no server block of
        # their own: otherwise nginx answered those with whichever customer's
        # vhost sorts first, showing a stranger that customer's certificate.
        server {
          listen 443 ssl http2 default_server;
          server_name {% for d in jrok_base_domains %}{{ d }} *.{{ d }} {% endfor %};

          # One wildcard certificate covers every base domain.
          ssl_certificate /etc/letsencrypt/live/{{ jrok_ssl_cert_name }}/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/{{ jrok_ssl_cert_name }}/privkey.pem;

          # SSL configuration
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers HIGH:!aNULL:!MD5;
          ssl_prefer_server_ciphers on;
          ssl_session_cache shared:SSL:10m;
          ssl_session_timeout 10m;
          
          # Rate limiting: jrok's own hosts only (see $jrok_limit_key), and its
          # certificate API more strictly ($jrok_strict_key).
          limit_req zone=jrok_general burst=20 nodelay;
          limit_req zone=jrok_strict burst=5 nodelay;

          # The agent endpoint: this edge's jrok only (see upstream jrok_agents).
          location = /ws/agent {
            access_log /var/log/nginx/access.log combined_noquery;
            limit_req zone=agents burst={{ jrok_agent_burst | default(2000) }} nodelay;
            proxy_pass http://jrok_agents;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
          }

          # WebSocket support for agents
          location /ws/ {
            # No query strings in this log: old agents put their API key there.
            access_log /var/log/nginx/access.log combined_noquery;

            proxy_pass http://jrok;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Long timeout for WebSockets
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
          }

          # Proxy settings
          location / {
            proxy_pass http://jrok;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            # Only port 80's challenge location may mark a request as a challenge.
            proxy_set_header X-Jrok-Acme-Challenge "";

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Edge cache (see proxy_cache_path). While the app or its tunnel is
            # down, cached files are still served (use_stale), except to what
            # the cache leaves to jrok ($jrok_cache_off).
            proxy_cache jrok_cache;
            # v2: drops what v1 kept, HTML among it.
            proxy_cache_key v2$scheme$host$request_uri;
            proxy_no_cache $jrok_not_shareable $jrok_is_html $http_authorization $jrok_cache_off;
            proxy_cache_bypass $http_authorization $jrok_cache_off;
            # No proxy_cache_lock: it makes concurrent requests for one URL wait
            # (up to 5 s) to learn whether the first answer is cacheable, which
            # stalled busy uncacheable URLs on staging (p99 5.4 s).
            proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
            proxy_cache_background_update on;

            # Timeouts. The read timeout is the longest quiet gap nginx allows,
            # so a visitor's idle WebSocket survives an hour. Plain HTTP is cut
            # off sooner by jrok itself (TUNNEL_REQUEST_TIMEOUT_MS to first byte).
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
          }

          # /health and /certificates/ have no location of their own: on an
          # app's name they are the app's (an uptime monitor on its /health got
          # jrok's answer while the app was down), and on a base domain itself
          # jrok answers them through "/" above, with the Host it needs.
        }
        {% if jrok_peer_tls | bool %}

        # Edge-to-edge entry: requests other edges forward here (jrok) or fall
        # back to (their nginx gateway). Only other edges may connect. Host
        # names this edge; the visitor's is in X-Jrok-Forwarded-Host. Always
        # this edge's jrok, never the edge cache: the sending edge has its own.
        server {
          listen 443 ssl http2;
          server_name {{ forward_host }} {{ jrok_peer_name }};

          ssl_certificate /etc/letsencrypt/live/{{ jrok_ssl_cert_name }}/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/{{ jrok_ssl_cert_name }}/privkey.pem;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers HIGH:!aNULL:!MD5;
          ssl_prefer_server_ciphers on;
          ssl_session_cache shared:SSL:10m;
          ssl_session_timeout 10m;

          {% for source in jrok_peer_sources %}
          allow {{ source }};
          {% endfor %}
          deny all;

          # An inner hop: the front server block adds the security headers and
          # compresses, once. Any add_header here stops the http-level ones
          # being inherited (they'd repeat); an empty one is never sent.
          add_header X-Jrok-Inner-Hop "";
          gzip off;

          location / {
            if ($http_x_jrok_forwarded_host = "") {
              return 400;
            }
            proxy_pass http://jrok_this_edge;
            proxy_http_version 1.1;
            proxy_set_header Host $http_x_jrok_forwarded_host;
            proxy_set_header X-Forwarded-Host $http_x_jrok_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # jrok's "don't buffer" for live streams (event streams, streamed
            # pages) is obeyed here and also passed back: nginx drops it
            # otherwise, and the sending edge's nginx would hold the stream.
            proxy_pass_header X-Accel-Buffering;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
          }
        }
        {% endif %}
      }
    dest: /etc/nginx/nginx.conf
    backup: yes
    # Never install a config nginx would reject (every include path is absolute).
    validate: nginx -t -c %s
  register: nginx_conf
  tags: ["nginx"]

- name: Test Nginx configuration
  shell: nginx -t
  register: nginx_test
  tags: ["nginx"]

- name: Show Nginx test result
  debug:
    msg: "{{ nginx_test.stdout }}"
  tags: ["nginx"]

- name: Start and enable Nginx service
  systemd:
    name: nginx
    state: started
    enabled: yes
    daemon_reload: yes
  tags: ["nginx"]

- name: Reload Nginx so a changed configuration takes effect
  # "started" leaves a running nginx alone, including the one apt started with
  # its default config, so without this the file above never went live.
  # A reload nginx refuses (one that passes nginx -t, such as an existing
  # limit zone given a new key) leaves the old configuration running while
  # systemctl reports success: production ran its old nginx.conf that way
  # after the first multi-edge deploy. So read what nginx logged about it.
  shell: |
    since=$(date '+%Y/%m/%d %H:%M:%S')
    systemctl reload nginx
    sleep 2
    refused=$(awk -v s="$since" 'substr($0, 1, 19) >= s && /\[emerg\]/' /var/log/nginx/error.log)
    if [ -n "$refused" ]; then echo "$refused" >&2; exit 1; fi
  args:
    executable: /bin/bash
  when: nginx_conf.changed
  tags: ["nginx"]

- name: Verify Nginx is running
  shell: systemctl status nginx | head -10
  register: nginx_status
  tags: ["nginx"]

- name: Show Nginx status
  debug:
    msg: "{{ nginx_status.stdout }}"
  tags: ["nginx"]
