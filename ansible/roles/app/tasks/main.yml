---
# Ansible Role: Deploy and run jrok application (without Docker)

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["app"]

- name: Copy application code from staging
  shell: |
    if [ -d /root/jrok-staging ]; then
      rsync -av --delete \
        --exclude=node_modules \
        --exclude=.git \
        --exclude=.env \
        /root/jrok-staging/ {{ app_dir }}/
      echo "Code copied from staging"
    else
      echo "No staging directory found, skipping copy"
    fi
  args:
    executable: /bin/bash
  tags: ["app"]

- name: Create data directory
  file:
    path: "{{ app_dir }}/data"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["app"]

- name: Create logs directory
  file:
    path: "{{ app_dir }}/logs"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["app"]

- name: Install unzip (required for Bun)
  apt:
    name: unzip
    state: present
  tags: ["app"]

- name: Install Bun runtime
  shell: |
    if ! command -v /root/.bun/bin/bun &> /dev/null; then
      curl -fsSL https://bun.sh/install | bash
    fi
  args:
    executable: /bin/bash
  tags: ["app"]

- name: Verify Bun installation
  shell: /root/.bun/bin/bun --version
  register: bun_version
  tags: ["app"]

- name: Show Bun version
  debug:
    msg: "Bun version: {{ bun_version.stdout }}"
  tags: ["app"]

- name: Install dependencies with Bun
  shell: |
    cd {{ app_dir }}
    /root/.bun/bin/bun install
  args:
    executable: /bin/bash
  tags: ["app"]

- name: Build application with Bun
  shell: |
    cd {{ app_dir }}
    /root/.bun/bin/bun run build
  args:
    executable: /bin/bash
  register: build_output
  tags: ["app"]

- name: Show build output
  debug:
    msg: "{{ build_output.stdout_lines }}"
  tags: ["app"]

- name: Create systemd service file
  copy:
    content: |
      [Unit]
      Description=jrok - Reverse Tunnel Service
      After=network.target nginx.service
      Wants=nginx.service

      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ app_dir }}
      Environment=NODE_ENV=production
      Environment=PORT=3000
      Environment=MONGODB_URI={{ mongodb_uri }}
      Environment=API_KEY={{ cert_sync_api_key }}
      Environment=BASE_DOMAIN={{ jrok_base_domains[0] }}
      Environment=LEGACY_BASE_DOMAINS={{ jrok_base_domains[1:] | join(',') }}
      Environment=JWT_SECRET={{ jwt_secret }}
      Environment=KOOMPI_CLIENT_ID={{ koompi_client_id }}
      Environment=KOOMPI_CLIENT_SECRET={{ koompi_client_secret }}
      Environment=KOOMPI_REDIRECT_URI={{ koompi_redirect_uri }}
      Environment=DASHBOARD_URL={{ dashboard_url }}
      Environment=ALLOWED_ORIGINS={{ dashboard_url }},https://{{ domain_name }}
      Environment=VPS_HOST={{ tcp_public_host | default(ansible_host) }}
      # Per-server hostname customers dial for TCP tunnels (databases, SSH),
      # e.g. "sgp1.private.koompi.cloud". It MUST resolve to this machine alone:
      # an allocated TCP port listens on one server only, and a raw TCP
      # connection carries no hostname, so a customer sent to the round-robin
      # address lands on a server that isn't listening and is simply refused.
      # Set tcp_public_host per host in the inventory.
      Environment=TCP_PUBLIC_HOST={{ tcp_public_host | default(ansible_host) }}
      Environment=VPS_ID={{ vps_id | default(ansible_hostname) }}
      Environment=VPS_NAME={{ vps_id | default(ansible_hostname) }}
      Environment=VPS_REGION={{ vps_region | default('default') }}
      # true: custom-domain certificates from Let's Encrypt's staging service (test environments)
      Environment=CERTBOT_TEST_CERT={{ certbot_test_cert | default(false) | bool | lower }}
      Environment=NGINX_PATH=/etc/nginx/sites-available
      # Where nginx falls back to while this jrok is down (custom-domain vhosts;
      # nginx.conf lists it itself): nginx's edge-to-edge gateway with
      # jrok_peer_tls, else the other edges' jrok port. Set jrok_peer_address
      # per host to use a private address instead.
      {% if jrok_peer_tls | bool %}
      Environment=JROK_PEERS=127.0.0.1:{{ jrok_peer_gateway_port }}
      # Other edges forward here, over HTTPS, proving themselves with the key
      # (src/utils/peerLink.ts).
      Environment=FORWARD_URL=https://{{ forward_host }}
      Environment=JROK_PEER_KEY={{ jrok_peer_key }}
      {% else %}
      Environment=JROK_PEERS={% for h in groups['jrok_servers'] | default([]) if h != inventory_hostname %}{{ hostvars[h].jrok_peer_address | default(hostvars[h].ansible_host) }}:{{ jrok_port | default('3000') }}{{ '' if loop.last else ',' }}{% endfor %}

      {% endif %}

      # TCP port range (unique per server for multi-server setup)
      Environment=TCP_PORT_MIN={{ tcp_port_min | default('10000') }}
      Environment=TCP_PORT_MAX={{ tcp_port_max | default('20000') }}

      # Run the pre-built bundle for better performance
      ExecStart=/root/.bun/bin/bun run dist/index.js

      Restart=always
      RestartSec=5

      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=jrok

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/jrok.service
    owner: root
    group: root
    mode: '0644'
  tags: ["app"]

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  tags: ["app"]

- name: Stop jrok service (if running)
  systemd:
    name: jrok
    state: stopped
  ignore_errors: yes
  tags: ["app"]

- name: Start jrok service
  systemd:
    name: jrok
    state: started
    enabled: yes
  tags: ["app"]

- name: Wait for application to start
  wait_for:
    port: 3000
    delay: 3
    timeout: 30
  tags: ["app"]

- name: Check application health
  uri:
    url: "http://localhost:3000/health"
    method: GET
    return_content: yes
  register: health_check
  retries: 3
  delay: 2
  tags: ["app", "verify"]

- name: Show application status
  debug:
    msg: "✅ Application is running and healthy!"
  when: health_check.status == 200
  tags: ["app", "verify"]

- name: Show service logs
  shell: journalctl -u jrok --no-pager -n 30
  register: service_logs
  tags: ["app", "verify"]

- name: Display service logs
  debug:
    msg: "{{ service_logs.stdout_lines }}"
  tags: ["app", "verify"]

# Health-checked DNS (plan Phase 3.1, src/dnsHealth/main.ts): one checker per
# edge. Each probes the other edges from outside; when most see one down, the
# lease holder takes its address out of dns_health_records (comma-separated
# names, e.g. "public.koompi.cloud,*.public.koompi.cloud") and puts it back
# when they see it up. Edges are named by vps_id and reached on dns_address
# (default ansible_host). Uses certbot's Cloudflare token; records stay DNS
# only. dns_health_dry_run=true logs what it would change instead.
- name: Health-checked DNS service (dns_health_records)
  copy:
    content: |
      [Unit]
      Description=jrok health-checked DNS
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ app_dir }}
      Environment=MONGODB_URI={{ mongodb_uri }}
      Environment=DNS_HEALTH_CHECKER_ID={{ vps_id | default(inventory_hostname) }}
      Environment=DNS_HEALTH_EDGES={% for h in groups['jrok_servers'] %}{{ hostvars[h].vps_id | default(h) }}={{ hostvars[h].dns_address | default(hostvars[h].ansible_host) }}{{ '' if loop.last else ',' }}{% endfor %}

      Environment=DNS_HEALTH_RECORDS={{ dns_health_records }}
      Environment=DNS_HEALTH_CHECK_HOST={{ jrok_base_domains[0] }}
      Environment=CLOUDFLARE_API_TOKEN_FILE=/etc/letsencrypt/secrets/cloudflare.ini
      Environment=DNS_HEALTH_DRY_RUN={{ dns_health_dry_run | default(false) | bool | lower }}
      ExecStart=/root/.bun/bin/bun run src/dnsHealth/main.ts
      Restart=always
      RestartSec=5
      SyslogIdentifier=jrok-dns-health

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/jrok-dns-health.service
    owner: root
    group: root
    mode: '0644'
  when: dns_health_records is defined
  tags: ["app", "dns-health"]

- name: Start health-checked DNS (restarted for new code; another checker holds the lease meanwhile)
  systemd:
    name: jrok-dns-health
    state: restarted
    enabled: yes
    daemon_reload: yes
  when: dns_health_records is defined
  tags: ["app", "dns-health"]

- name: Health-checked DNS off without dns_health_records
  systemd:
    name: jrok-dns-health
    state: stopped
    enabled: no
  when: dns_health_records is not defined
  failed_when: false
  tags: ["app", "dns-health"]
