---
# Ansible Role: Deploy and run jrok application (without Docker)

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["app"]

- name: Copy application code from staging
  shell: |
    if [ -d /root/jrok-staging ]; then
      rsync -av --delete \
        --exclude=node_modules \
        --exclude=.git \
        --exclude=.env \
        /root/jrok-staging/ {{ app_dir }}/
      echo "Code copied from staging"
    else
      echo "No staging directory found, skipping copy"
    fi
  args:
    executable: /bin/bash
  tags: ["app"]

- name: Create data directory
  file:
    path: "{{ app_dir }}/data"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["app"]

- name: Create logs directory
  file:
    path: "{{ app_dir }}/logs"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["app"]

- name: Install unzip (required for Bun)
  apt:
    name: unzip
    state: present
  tags: ["app"]

# Pinned: the version staging and production were tested on (bun_version to change it).
- name: Install Bun runtime
  shell: |
    if ! command -v /root/.bun/bin/bun &> /dev/null; then
      curl -fsSL https://bun.sh/install | bash -s "bun-v{{ bun_version | default('1.3.4') }}"
    fi
  args:
    executable: /bin/bash
  tags: ["app"]

- name: Verify Bun installation
  shell: /root/.bun/bin/bun --version
  register: bun_version
  tags: ["app"]

- name: Show Bun version
  debug:
    msg: "Bun version: {{ bun_version.stdout }}"
  tags: ["app"]

- name: Install dependencies with Bun
  shell: |
    cd {{ app_dir }}
    /root/.bun/bin/bun install
  args:
    executable: /bin/bash
  tags: ["app"]

- name: Build application with Bun
  shell: |
    cd {{ app_dir }}
    /root/.bun/bin/bun run build
  args:
    executable: /bin/bash
  register: build_output
  tags: ["app"]

- name: Show build output
  debug:
    msg: "{{ build_output.stdout_lines }}"
  tags: ["app"]

- name: jrok configuration directory (secrets, the drain file)
  file:
    path: /etc/jrok
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["app", "dns-health"]

# Secrets in a file only root can read. Unit files are world-readable, and so
# is `systemctl show`: any local process (nginx's www-data included) could
# read the database password and the server key from them. Both services
# load this file.
- name: jrok secrets (root only)
  copy:
    content: |
      MONGODB_URI={{ mongodb_uri }}
      API_KEY={{ cert_sync_api_key }}
      JWT_SECRET={{ jwt_secret }}
      KOOMPI_CLIENT_SECRET={{ koompi_client_secret }}
      {% if jrok_peer_tls | bool %}
      JROK_PEER_KEY={{ jrok_peer_key }}
      {% endif %}
      {% if telegram_bot_token | length > 0 and telegram_chat_id | length > 0 %}
      TELEGRAM_BOT_TOKEN={{ telegram_bot_token }}
      {% endif %}
    dest: /etc/jrok/jrok.env
    owner: root
    group: root
    mode: '0600'
  no_log: true
  tags: ["app", "dns-health"]

- name: Cap the system journal (jrok logs every agent connection)
  block:
    - file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: '0755'
    - copy:
        content: |
          [Journal]
          SystemMaxUse=500M
        dest: /etc/systemd/journald.conf.d/jrok.conf
        mode: '0644'
      register: journald_conf
    - systemd:
        name: systemd-journald
        state: restarted
      when: journald_conf.changed
  tags: ["app"]

- name: Create systemd service file
  copy:
    content: |
      [Unit]
      Description=jrok - Reverse Tunnel Service
      After=network.target nginx.service
      Wants=nginx.service

      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ app_dir }}
      EnvironmentFile=/etc/jrok/jrok.env
      Environment=NODE_ENV=production
      Environment=PORT=3000
      # Forwarding headers (the visitor's address, nginx's ACME marker) count
      # only from nginx on this machine and the other edges; anyone else
      # reaching port 3000 directly is taken for who they are.
      Environment=TRUSTED_PROXY_IPS=127.0.0.1,::1{% for source in jrok_peer_sources %},{{ source }}{% endfor %}

      Environment=BASE_DOMAIN={{ jrok_base_domains[0] }}
      Environment=LEGACY_BASE_DOMAINS={{ jrok_base_domains[1:] | join(',') }}
      Environment=KOOMPI_CLIENT_ID={{ koompi_client_id }}
      Environment=KOOMPI_REDIRECT_URI={{ koompi_redirect_uri }}
      Environment=DASHBOARD_URL={{ dashboard_url }}
      Environment=ALLOWED_ORIGINS={{ dashboard_url }},https://{{ domain_name }}
      Environment=VPS_HOST={{ tcp_public_host | default(ansible_host) }}
      # Per-server hostname customers dial for TCP tunnels (databases, SSH),
      # e.g. "sgp1.private.koompi.cloud". It MUST resolve to this machine alone:
      # an allocated TCP port listens on one server only, and a raw TCP
      # connection carries no hostname, so a customer sent to the round-robin
      # address lands on a server that isn't listening and is simply refused.
      # Set tcp_public_host per host in the inventory.
      Environment=TCP_PUBLIC_HOST={{ tcp_public_host | default(ansible_host) }}
      Environment=VPS_ID={{ vps_id | default(ansible_hostname) }}
      Environment=VPS_NAME={{ vps_id | default(ansible_hostname) }}
      Environment=VPS_REGION={{ vps_region | default('default') }}
      # Largest request body jrok accepts; nginx's client_max_body_size caps it too.
      Environment=MAX_REQUEST_BODY_MB={{ max_request_body_mb | default(10) }}
      # Flood protection (src/services/floodGuard.ts); unset: its defaults.
      # flood_exempt: addresses never blocked (e.g. kconsole's hosts).
      {% if flood_requests is defined %}
      Environment=FLOOD_REQUESTS={{ flood_requests }}
      {% endif %}
      {% if flood_block_seconds is defined %}
      Environment=FLOOD_BLOCK_S={{ flood_block_seconds }}
      {% endif %}
      {% if flood_exempt is defined %}
      Environment=FLOOD_EXEMPT={{ flood_exempt }}
      {% endif %}
      {% if app_max_waiting is defined %}
      Environment=APP_MAX_WAITING={{ app_max_waiting }}
      {% endif %}
      {% if telegram_bot_token | length > 0 and telegram_chat_id | length > 0 %}
      Environment=TELEGRAM_CHAT_ID={{ telegram_chat_id }}
      {% endif %}
      {% if server_key_sources is defined %}
      # The server key (API_KEY) is accepted only from these and this machine
      # (src/utils/serverKeySources.ts): server_key_sources (kconsole's
      # addresses, comma-separated) plus every edge.
      Environment=SERVER_KEY_SOURCES={{ ((server_key_sources | string).split(',') | map('trim') | select | list + (groups['jrok_servers'] | map('extract', hostvars, 'ansible_host') | list)) | unique | join(',') }}
      {% endif %}
      {% if tcp_takeover_minutes is defined %}
      # How long an edge must be silent before its TCP tunnels move to another (default 10)
      Environment=TCP_TAKEOVER_MINUTES={{ tcp_takeover_minutes }}
      {% endif %}
      # true: custom-domain certificates from Let's Encrypt's staging service (test environments)
      Environment=CERTBOT_TEST_CERT={{ certbot_test_cert | default(false) | bool | lower }}
      Environment=NGINX_PATH=/etc/nginx/sites-available
      # Where nginx falls back to while this jrok is down (custom-domain vhosts;
      # nginx.conf lists it itself): nginx's edge-to-edge gateway with
      # jrok_peer_tls, else the other edges' jrok port. Set jrok_peer_address
      # per host to use a private address instead.
      {% if jrok_peer_tls | bool %}
      Environment=JROK_PEERS=127.0.0.1:{{ jrok_peer_gateway_port }}
      # Other edges forward here, over HTTPS, proving themselves with the key
      # (src/utils/peerLink.ts).
      Environment=FORWARD_URL=https://{{ forward_host }}
      {% else %}
      Environment=JROK_PEERS={% for h in groups['jrok_servers'] | default([]) if h != inventory_hostname %}{{ hostvars[h].jrok_peer_address | default(hostvars[h].ansible_host) }}:{{ jrok_port | default('3000') }}{{ '' if loop.last else ',' }}{% endfor %}

      {% endif %}

      # TCP port range (unique per server for multi-server setup)
      Environment=TCP_PORT_MIN={{ tcp_port_min | default('10000') }}
      Environment=TCP_PORT_MAX={{ tcp_port_max | default('20000') }}

      # Run the pre-built bundle for better performance
      ExecStart=/root/.bun/bin/bun run dist/index.js

      Restart=always
      RestartSec=5

      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=jrok

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/jrok.service
    owner: root
    group: root
    mode: '0644'
  tags: ["app"]

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  tags: ["app"]

# Rolling deploy (serial): after the restart, wait until this edge has its
# agents back before the play moves on to the next edge. Otherwise an app whose
# agent hadn't yet reconnected here would be down while the next edge
# restarts. The count comes from this edge's heartbeat (every 10 s).
- name: Agents on this edge before the restart
  uri:
    url: "http://127.0.0.1:{{ jrok_port | default('3000') }}/cluster/stats"
    headers:
      Authorization: "Bearer {{ cert_sync_api_key }}"
    return_content: yes
  register: agents_before
  failed_when: false
  no_log: true
  tags: ["app"]

- name: Count them
  set_fact:
    jrok_agents_before: "{{ ((agents_before.json | default({})).serverDetails | default([]) | selectattr('serverId', 'equalto', vps_id | default(ansible_hostname)) | map(attribute='agentCount') | list + [0]) | first | int }}"
  tags: ["app"]

- name: Stop jrok service (if running)
  systemd:
    name: jrok
    state: stopped
  ignore_errors: yes
  tags: ["app"]

- name: Start jrok service
  systemd:
    name: jrok
    state: started
    enabled: yes
  tags: ["app"]

- name: Wait for application to start
  wait_for:
    port: 3000
    delay: 3
    timeout: 30
  tags: ["app"]

- name: Check application health
  uri:
    url: "http://localhost:3000/health"
    method: GET
    return_content: yes
  register: health_check
  retries: 3
  delay: 2
  tags: ["app", "verify"]

- name: Wait for this edge's agents to come back (jrok_agent_wait_seconds, default 180)
  uri:
    url: "http://127.0.0.1:{{ jrok_port | default('3000') }}/cluster/stats"
    headers:
      Authorization: "Bearer {{ cert_sync_api_key }}"
    return_content: yes
  register: agents_after
  until: >-
    ((agents_after.json | default({})).serverDetails | default([]) | selectattr('serverId', 'equalto', vps_id | default(ansible_hostname))
    | map(attribute='agentCount') | list + [0]) | first >= (jrok_agents_before | int * (jrok_agent_return | default(0.95) | float)) | int
  retries: "{{ ((jrok_agent_wait_seconds | default(180)) | int) // 5 }}"
  delay: 5
  failed_when: false
  when: jrok_agents_before | int > 0
  no_log: true
  tags: ["app"]

- name: Agents back on this edge
  set_fact:
    jrok_agents_after: "{{ ((agents_after.json | default({})).serverDetails | default([]) | selectattr('serverId', 'equalto', vps_id | default(ansible_hostname)) | map(attribute='agentCount') | list + [0]) | first | int }}"
  when: agents_after is not skipped
  tags: ["app"]

- name: Report agents on this edge
  debug:
    msg: "{{ jrok_agents_after }} agents connected (before the restart: {{ jrok_agents_before }})"
  when: agents_after is not skipped
  tags: ["app"]

- name: Tell a person the rolling deploy stopped (Telegram, when configured)
  uri:
    url: "https://api.telegram.org/bot{{ telegram_bot_token }}/sendMessage"
    method: POST
    body_format: json
    body:
      chat_id: "{{ telegram_chat_id }}"
      text: "🛑 jrok deploy stopped at {{ inventory_hostname }}: only {{ jrok_agents_after }} of {{ jrok_agents_before }} agents came back; the other edges were not restarted."
  failed_when: false
  no_log: true
  when: >-
    telegram_bot_token | length > 0 and telegram_chat_id | length > 0 and agents_after is not skipped and
    (jrok_agents_after | int) < ((jrok_agents_before | int) * (jrok_agent_return | default(0.95) | float)) | int
  tags: ["app"]

- name: Stop the rolling deploy if this edge's agents didn't come back
  fail:
    msg: >-
      Only {{ jrok_agents_after }} of {{ jrok_agents_before }} agents came back to {{ inventory_hostname }} within
      {{ jrok_agent_wait_seconds | default(180) }} s, so the other edges were not restarted: apps whose agents are
      missing here are being served by them. Find out why the workers' agents aren't reconnecting, then run the
      deploy again (jrok_agent_return=0 skips this check).
  when: agents_after is not skipped and (jrok_agents_after | int) < ((jrok_agents_before | int) * (jrok_agent_return | default(0.95) | float)) | int
  tags: ["app"]

- name: Show application status
  debug:
    msg: "✅ Application is running and healthy!"
  when: health_check.status == 200
  tags: ["app", "verify"]

- name: Show service logs
  shell: journalctl -u jrok --no-pager -n 30
  register: service_logs
  tags: ["app", "verify"]

- name: Display service logs
  debug:
    msg: "{{ service_logs.stdout_lines }}"
  tags: ["app", "verify"]

# Health-checked DNS (plan Phase 3.1, src/dnsHealth/main.ts): one checker per
# edge. Each probes the other edges from outside; when most see one down, the
# lease holder takes its address out of dns_health_records (comma-separated
# names, e.g. "public.koompi.cloud,*.public.koompi.cloud") and puts it back
# when they see it up. Edges are named by vps_id and reached on dns_address
# (default ansible_host). Uses certbot's Cloudflare token; records stay DNS
# only. dns_health_dry_run=true logs what it would change instead.
- name: Health-checked DNS service (dns_health_records)
  copy:
    content: |
      [Unit]
      Description=jrok health-checked DNS
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ app_dir }}
      EnvironmentFile=/etc/jrok/jrok.env
      Environment=DNS_HEALTH_CHECKER_ID={{ vps_id | default(inventory_hostname) }}
      Environment=DNS_HEALTH_EDGES={% for h in groups['jrok_servers'] %}{{ hostvars[h].vps_id | default(h) }}={{ hostvars[h].dns_address | default(hostvars[h].ansible_host) }}{{ '' if loop.last else ',' }}{% endfor %}

      Environment=DNS_HEALTH_RECORDS={{ dns_health_records }}
      Environment=DNS_HEALTH_CHECK_HOST={{ jrok_base_domains[0] }}
      Environment=CLOUDFLARE_API_TOKEN_FILE=/etc/letsencrypt/secrets/cloudflare.ini
      Environment=DNS_HEALTH_DRY_RUN={{ dns_health_dry_run | default(false) | bool | lower }}
      {% if telegram_bot_token | length > 0 and telegram_chat_id | length > 0 %}
      Environment=TELEGRAM_CHAT_ID={{ telegram_chat_id }}
      {% endif %}
      ExecStart=/root/.bun/bin/bun run src/dnsHealth/main.ts
      Restart=always
      RestartSec=5
      SyslogIdentifier=jrok-dns-health

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/jrok-dns-health.service
    owner: root
    group: root
    mode: '0644'
  when: dns_health_records is defined
  tags: ["app", "dns-health"]

- name: Start health-checked DNS (restarted for new code; another checker holds the lease meanwhile)
  systemd:
    name: jrok-dns-health
    state: restarted
    enabled: yes
    daemon_reload: yes
  when: dns_health_records is defined
  tags: ["app", "dns-health"]

- name: Health-checked DNS off without dns_health_records
  systemd:
    name: jrok-dns-health
    state: stopped
    enabled: no
  when: dns_health_records is not defined
  failed_when: false
  tags: ["app", "dns-health"]
