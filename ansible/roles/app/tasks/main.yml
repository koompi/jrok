---
# Ansible Role: Deploy and run kproxy application (without Docker)

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["app"]

- name: Copy application code from staging
  shell: |
    if [ -d /root/jrok-staging ]; then
      rsync -av --delete \
        --exclude=node_modules \
        --exclude=.git \
        --exclude=.env \
        --exclude=cli \
        /root/jrok-staging/ {{ app_dir }}/
      echo "Code copied from staging"
    else
      echo "No staging directory found, skipping copy"
    fi
  args:
    executable: /bin/bash
  tags: ["app"]

- name: Create data directory
  file:
    path: "{{ app_dir }}/data"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["app"]

- name: Create logs directory
  file:
    path: "{{ app_dir }}/logs"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["app"]

- name: Install unzip (required for Bun)
  apt:
    name: unzip
    state: present
  tags: ["app"]

- name: Install Bun runtime
  shell: |
    if ! command -v /root/.bun/bin/bun &> /dev/null; then
      curl -fsSL https://bun.sh/install | bash
    fi
  args:
    executable: /bin/bash
  tags: ["app"]

- name: Verify Bun installation
  shell: /root/.bun/bin/bun --version
  register: bun_version
  tags: ["app"]

- name: Show Bun version
  debug:
    msg: "Bun version: {{ bun_version.stdout }}"
  tags: ["app"]

- name: Install dependencies with Bun
  shell: |
    cd {{ app_dir }}
    /root/.bun/bin/bun install
  args:
    executable: /bin/bash
  tags: ["app"]

- name: Build application with Bun
  shell: |
    cd {{ app_dir }}
    /root/.bun/bin/bun run build
  args:
    executable: /bin/bash
  register: build_output
  tags: ["app"]

- name: Show build output
  debug:
    msg: "{{ build_output.stdout_lines }}"
  tags: ["app"]

- name: Create systemd service file
  copy:
    content: |
      [Unit]
      Description=kproxy - Reverse Tunnel Service
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ app_dir }}
      Environment=NODE_ENV=production
      Environment=PORT=3000
      Environment=MONGODB_URI={{ mongodb_uri }}
      Environment=API_KEY={{ api_key }}
      Environment=BASE_DOMAIN={{ domain_name }}
      Environment=JWT_SECRET={{ jwt_secret }}
      Environment=KOOMPI_CLIENT_ID={{ koompi_client_id }}
      Environment=KOOMPI_CLIENT_SECRET={{ koompi_client_secret }}
      Environment=KOOMPI_REDIRECT_URI={{ koompi_redirect_uri }}
      Environment=DASHBOARD_URL={{ dashboard_url }}
      Environment=ALLOWED_ORIGINS={{ dashboard_url }},https://{{ domain_name }}
      Environment=VPS_HOST={{ vps_host | default('localhost') }}
      Environment=VPS_ID={{ vps_id | default(ansible_hostname) }}
      Environment=VPS_NAME={{ vps_id | default(ansible_hostname) }}
      Environment=VPS_REGION={{ vps_region | default('default') }}
      # Cloudflare for SaaS (edge TLS + custom hostnames)
      Environment=CF_API_TOKEN={{ cf_api_token }}
      Environment=CF_ZONE_ID={{ cf_zone_id }}
      Environment=CF_SAAS_FALLBACK_HOSTNAME={{ cf_saas_fallback_hostname }}
      # Gossip mesh shared secret (cross-node routing)
      Environment=GOSSIP_SECRET={{ gossip_secret }}
      # TCP port range (unique per server for multi-server setup)
      Environment=TCP_PORT_MIN={{ tcp_port_min | default('10000') }}
      Environment=TCP_PORT_MAX={{ tcp_port_max | default('20000') }}

      # Run the pre-built bundle for better performance
      ExecStart=/root/.bun/bin/bun run dist/index.js

      Restart=always
      RestartSec=5

      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=kproxy

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/kproxy.service
    owner: root
    group: root
    mode: '0644'
  tags: ["app"]

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  tags: ["app"]

- name: Stop kproxy service (if running)
  systemd:
    name: kproxy
    state: stopped
  ignore_errors: yes
  tags: ["app"]

- name: Start kproxy service
  systemd:
    name: kproxy
    state: started
    enabled: yes
  tags: ["app"]

- name: Wait for application to start
  wait_for:
    port: 3000
    delay: 3
    timeout: 30
  tags: ["app"]

- name: Check application health
  uri:
    url: "http://localhost:3000/health"
    method: GET
    return_content: yes
  register: health_check
  retries: 3
  delay: 2
  tags: ["app", "verify"]

- name: Show application status
  debug:
    msg: "✅ Application is running and healthy!"
  when: health_check.status == 200
  tags: ["app", "verify"]

- name: Show service logs
  shell: journalctl -u kproxy --no-pager -n 30
  register: service_logs
  tags: ["app", "verify"]

- name: Display service logs
  debug:
    msg: "{{ service_logs.stdout_lines }}"
  tags: ["app", "verify"]
