---
# Ansible Role: Install and configure Certbot with Cloudflare DNS

- name: Install certbot and cloudflare plugin
  apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present
  tags: ["certbot"]

- name: Create certbot credentials directory
  file:
    path: /etc/letsencrypt/secrets
    state: directory
    mode: '0700'
  tags: ["certbot"]

- name: Create Cloudflare credentials file
  copy:
    content: |
      # Cloudflare API Token
      dns_cloudflare_api_token={{ cloudflare_token }}
    dest: /etc/letsencrypt/secrets/cloudflare.ini
    mode: '0600'
  tags: ["certbot"]


- name: Check if certificate already exists
  stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: cert_exists
  tags: ["certbot"]

- name: Issue certificate with Certbot (DNS-based for wildcard)
  shell: |
    certbot certonly \
      --dns-cloudflare \
      --dns-cloudflare-credentials /etc/letsencrypt/secrets/cloudflare.ini \
      --email {{ certbot_email }} \
      --agree-tos \
      --non-interactive \
      -d "{{ domain_name }}" \
      -d "*.{{ domain_name }}"
  when: not cert_exists.stat.exists
  tags: ["certbot"]
  register: certbot_result
  ignore_errors: yes

- name: Create Certbot renewal hook directory
  # "deploy" rather than "post": deploy hooks run ONCE PER RENEWED CERTIFICATE
  # with $RENEWED_LINEAGE naming which one, whereas post hooks run once after
  # the whole run with no way to tell what was renewed. The hook used to live in
  # post/ with a single hardcoded domain, so every CUSTOM domain's renewal was
  # silently never uploaded — each server kept renewing its own copy locally and
  # the copies drifted apart.
  file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: '0755'
  tags: ["certbot"]

- name: Remove superseded post-renewal hook
  # Left behind it would keep re-uploading only the base domain on every run.
  file:
    path: /etc/letsencrypt/renewal-hooks/post/mongodb-sync.sh
    state: absent
  tags: ["certbot"]

- name: Create certificate MongoDB sync hook script
  copy:
    content: |
      #!/bin/bash
      # Certificate renewal hook: publish the renewed certificate to MongoDB so
      # every other jrok server can pull it.
      #
      # Runs once per renewed certificate. Certbot sets:
      #   RENEWED_LINEAGE  /etc/letsencrypt/live/<name>   (this certificate)
      #   RENEWED_DOMAINS  space-separated names on it
      #
      # Using RENEWED_LINEAGE instead of a hardcoded domain is what makes CUSTOM
      # domains sync: the previous version only ever uploaded the base domain,
      # so a customer's certificate renewed on one server never reached the
      # others and their copy expired.

      set -u

      API_KEY="{{ cert_sync_api_key }}"
      CONTROL_SERVER="http://localhost:{{ jrok_port | default('3000') }}"
      LOG_FILE="/var/log/certbot-sync.log"

      log() { echo "$(date -Is): $*" >> "$LOG_FILE"; }

      CERT_PATH="${RENEWED_LINEAGE:-}"
      if [ -z "$CERT_PATH" ]; then
        log "❌ RENEWED_LINEAGE not set - hook must be in renewal-hooks/deploy/. Skipping."
        exit 0
      fi

      # The lineage directory name is the key certificates are stored under, and
      # is what other servers write to on disk when they pull.
      DOMAIN="$(basename "$CERT_PATH")"

      for f in cert.pem chain.pem fullchain.pem privkey.pem; do
        if [ ! -r "$CERT_PATH/$f" ]; then
          log "❌ $DOMAIN: $CERT_PATH/$f missing or unreadable. Skipping."
          exit 0
        fi
      done

      CERT_B64=$(base64 -w0 < "$CERT_PATH/cert.pem")
      CHAIN_B64=$(base64 -w0 < "$CERT_PATH/chain.pem")
      FULLCHAIN_B64=$(base64 -w0 < "$CERT_PATH/fullchain.pem")
      PRIVKEY_B64=$(base64 -w0 < "$CERT_PATH/privkey.pem")

      # --data-binary @- with a heredoc: the payload holds base64 blobs several
      # KB long, far past a safe argv length.
      RESPONSE=$(curl -s --max-time 30 -X POST "$CONTROL_SERVER/certificates/upload" \
        -H "Authorization: Bearer $API_KEY" \
        -H "Content-Type: application/json" \
        --data-binary @- <<EOF
      {
        "domain": "$DOMAIN",
        "certPem": "$CERT_B64",
        "chainPem": "$CHAIN_B64",
        "fullchainPem": "$FULLCHAIN_B64",
        "privkeyPem": "$PRIVKEY_B64"
      }
      EOF
      )

      if echo "$RESPONSE" | jq -e '.success' > /dev/null 2>&1; then
        log "✅ $DOMAIN synced to MongoDB (v$(echo "$RESPONSE" | jq -r '.version // "?"'))"
      else
        # Loud: an un-synced certificate means other servers keep serving an
        # older copy of this domain until it expires.
        log "❌ $DOMAIN FAILED to sync - other servers will serve a stale certificate: $RESPONSE"
      fi
    dest: /etc/letsencrypt/renewal-hooks/deploy/mongodb-sync.sh
    mode: '0755'
  tags: ["certbot"]

- name: Ensure jq is available for the sync hook
  apt:
    name: jq
    state: present
  tags: ["certbot"]

- name: Setup Certbot auto-renewal timer
  systemd:
    name: certbot.timer
    state: started
    enabled: yes
  tags: ["certbot"]

- name: Verify Certbot installation
  shell: certbot --version
  register: certbot_version
  tags: ["certbot"]

- name: Show Certbot version
  debug:
    msg: "{{ certbot_version.stdout }}"
  tags: ["certbot"]

- name: List installed certificates
  shell: certbot certificates
  register: cert_list
  tags: ["certbot"]

- name: Show certificates
  debug:
    msg: "{{ cert_list.stdout }}"
  tags: ["certbot"]
