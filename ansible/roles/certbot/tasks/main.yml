---
# Ansible Role: Install and configure Certbot with Cloudflare DNS

- name: Install certbot and cloudflare plugin
  apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present
  tags: ["certbot"]

- name: Create certbot credentials directory
  file:
    path: /etc/letsencrypt/secrets
    state: directory
    mode: '0700'
  tags: ["certbot"]

# Only on the edges that need it (jrok_cloudflare_holders: the renewing edge
# and the DNS writers): the token can change the whole zone. The app role
# removes it from the others once their DNS checker no longer reads it.
- name: Create Cloudflare credentials file
  copy:
    content: |
      # Cloudflare API Token
      dns_cloudflare_api_token={{ cloudflare_token }}
    dest: /etc/letsencrypt/secrets/cloudflare.ini
    mode: '0600'
  when: inventory_hostname in jrok_cloudflare_holders
  tags: ["certbot"]


- name: Check if certificate already exists
  stat:
    path: "/etc/letsencrypt/live/{{ jrok_ssl_cert_name }}/fullchain.pem"
  register: cert_exists
  tags: ["certbot"]

# One edge (jrok_cert_renewer) issues and renews the wildcard certificate, and
# its deploy hook below publishes each renewal to MongoDB, from where every
# other edge's jrok pulls it (certificateSyncService). Let's Encrypt issues at
# most 5 certificates a week for the same names: an edge each would hit that
# when several edges are built or replaced in one week.
- name: Issue certificate with Certbot (DNS-based for wildcard)
  shell: |
    certbot certonly \
      --dns-cloudflare \
      --dns-cloudflare-credentials /etc/letsencrypt/secrets/cloudflare.ini \
      {% if certbot_email %}--email "{{ certbot_email }}"{% else %}--register-unsafely-without-email{% endif %} \
      --agree-tos \
      --non-interactive \
      --cert-name "{{ jrok_ssl_cert_name }}" \
      {% for d in jrok_base_domains %}-d "{{ d }}" -d "*.{{ d }}" {% endfor %}
  when: not cert_exists.stat.exists and inventory_hostname == jrok_cert_renewer
  tags: ["certbot"]
  register: certbot_result
  ignore_errors: yes

- name: Read the certificate from the renewing edge
  # A new edge gets a copy of the renewing edge's certificate rather than one
  # of its own; jrok keeps it current from MongoDB from then on.
  slurp:
    src: "/etc/letsencrypt/live/{{ jrok_ssl_cert_name }}/{{ item }}"
  loop: [cert.pem, chain.pem, fullchain.pem, privkey.pem]
  delegate_to: "{{ jrok_cert_renewer }}"
  register: renewer_cert
  no_log: true
  when: not cert_exists.stat.exists and inventory_hostname != jrok_cert_renewer
  tags: ["certbot"]

- name: Create the certificate directory
  file:
    path: "/etc/letsencrypt/live/{{ jrok_ssl_cert_name }}"
    state: directory
    mode: '0755'
  when: renewer_cert is not skipped
  tags: ["certbot"]

- name: Copy the certificate onto this edge
  copy:
    content: "{{ item.content | b64decode }}"
    dest: "/etc/letsencrypt/live/{{ jrok_ssl_cert_name }}/{{ item.item }}"
    mode: "{{ '0600' if item.item == 'privkey.pem' else '0644' }}"
  loop: "{{ renewer_cert.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  when: renewer_cert is not skipped
  tags: ["certbot"]

- name: Check for this edge's renewal settings
  stat:
    path: "/etc/letsencrypt/renewal/{{ jrok_ssl_cert_name }}.conf"
  register: renewal_conf
  tags: ["certbot"]

- name: Renew early on the renewing edge only; the others are a backup
  # The renewing edge renews 30 days before expiry and the others get the
  # renewal from MongoDB within minutes. An edge that issued its own copy
  # (before this rule, or a copy of /etc/letsencrypt) renews it only 10 days
  # before expiry: never while the renewing edge works, and in time if it
  # doesn't, provided it holds the Cloudflare token (a DNS writer). Certbot
  # keeps this line when it renews.
  lineinfile:
    path: "/etc/letsencrypt/renewal/{{ jrok_ssl_cert_name }}.conf"
    regexp: '^\s*renew_before_expiry\s*='
    line: "renew_before_expiry = {{ '30 days' if inventory_hostname == jrok_cert_renewer else '10 days' }}"
    insertbefore: '^\[renewalparams\]'
  when: renewal_conf.stat.exists
  tags: ["certbot"]

- name: Create Certbot renewal hook directory
  # "deploy" rather than "post": deploy hooks run ONCE PER RENEWED CERTIFICATE
  # with $RENEWED_LINEAGE naming which one, whereas post hooks run once after
  # the whole run with no way to tell what was renewed. The hook used to live in
  # post/ with a single hardcoded domain, so every CUSTOM domain's renewal was
  # silently never uploaded — each server kept renewing its own copy locally and
  # the copies drifted apart.
  file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: '0755'
  tags: ["certbot"]

- name: Remove superseded post-renewal hook
  # Left behind it would keep re-uploading only the base domain on every run.
  file:
    path: /etc/letsencrypt/renewal-hooks/post/mongodb-sync.sh
    state: absent
  tags: ["certbot"]

- name: Create certificate MongoDB sync hook script
  copy:
    content: |
      #!/bin/bash
      # Certificate renewal hook: publish the renewed certificate to MongoDB so
      # every other jrok server can pull it.
      #
      # Runs once per renewed certificate. Certbot sets:
      #   RENEWED_LINEAGE  /etc/letsencrypt/live/<name>   (this certificate)
      #   RENEWED_DOMAINS  space-separated names on it
      #
      # Using RENEWED_LINEAGE instead of a hardcoded domain is what makes CUSTOM
      # domains sync: the previous version only ever uploaded the base domain,
      # so a customer's certificate renewed on one server never reached the
      # others and their copy expired.

      set -u

      API_KEY="{{ cert_sync_api_key }}"
      CONTROL_SERVER="http://localhost:{{ jrok_port | default('3000') }}"
      LOG_FILE="/var/log/certbot-sync.log"

      log() { echo "$(date -Is): $*" >> "$LOG_FILE"; }

      CERT_PATH="${RENEWED_LINEAGE:-}"
      if [ -z "$CERT_PATH" ]; then
        log "❌ RENEWED_LINEAGE not set - hook must be in renewal-hooks/deploy/. Skipping."
        exit 0
      fi

      # The lineage directory name is the key certificates are stored under, and
      # is what other servers write to on disk when they pull.
      DOMAIN="$(basename "$CERT_PATH")"

      for f in cert.pem chain.pem fullchain.pem privkey.pem; do
        if [ ! -r "$CERT_PATH/$f" ]; then
          log "❌ $DOMAIN: $CERT_PATH/$f missing or unreadable. Skipping."
          exit 0
        fi
      done

      CERT_B64=$(base64 -w0 < "$CERT_PATH/cert.pem")
      CHAIN_B64=$(base64 -w0 < "$CERT_PATH/chain.pem")
      FULLCHAIN_B64=$(base64 -w0 < "$CERT_PATH/fullchain.pem")
      PRIVKEY_B64=$(base64 -w0 < "$CERT_PATH/privkey.pem")

      # --data-binary @- with a heredoc: the payload holds base64 blobs several
      # KB long, far past a safe argv length.
      RESPONSE=$(curl -s --max-time 30 -X POST "$CONTROL_SERVER/certificates/upload" \
        -H "Authorization: Bearer $API_KEY" \
        -H "Content-Type: application/json" \
        --data-binary @- <<EOF
      {
        "domain": "$DOMAIN",
        "certPem": "$CERT_B64",
        "chainPem": "$CHAIN_B64",
        "fullchainPem": "$FULLCHAIN_B64",
        "privkeyPem": "$PRIVKEY_B64"
      }
      EOF
      )

      if echo "$RESPONSE" | jq -e '.success' > /dev/null 2>&1; then
        log "✅ $DOMAIN synced to MongoDB (v$(echo "$RESPONSE" | jq -r '.version // "?"'))"
      else
        # Loud: an un-synced certificate means other servers keep serving an
        # older copy of this domain until it expires.
        log "❌ $DOMAIN FAILED to sync - other servers will serve a stale certificate: $RESPONSE"
      fi
    dest: /etc/letsencrypt/renewal-hooks/deploy/mongodb-sync.sh
    mode: '0700'
  tags: ["certbot"]

- name: Reload nginx after each renewal
  # nginx serves the certificate it loaded until it reloads. Without this the
  # server that renewed a certificate kept serving the old one until some
  # unrelated reload (a new vhost, a deploy); the other servers reload when
  # they pull it from MongoDB. Named to run after mongodb-sync.sh.
  copy:
    content: |
      #!/bin/bash
      nginx -t -q && systemctl reload nginx
    dest: /etc/letsencrypt/renewal-hooks/deploy/zz-reload-nginx.sh
    mode: '0755'
  tags: ["certbot"]

- name: Ensure jq is available for the sync hook
  apt:
    name: jq
    state: present
  tags: ["certbot"]

- name: Setup Certbot auto-renewal timer
  systemd:
    name: certbot.timer
    state: started
    enabled: yes
  tags: ["certbot"]

- name: Verify Certbot installation
  shell: certbot --version
  register: certbot_version
  tags: ["certbot"]

- name: Show Certbot version
  debug:
    msg: "{{ certbot_version.stdout }}"
  tags: ["certbot"]

- name: List installed certificates
  shell: certbot certificates
  register: cert_list
  tags: ["certbot"]

- name: Show certificates
  debug:
    msg: "{{ cert_list.stdout }}"
  tags: ["certbot"]
