# Ansible Inventory for jrok VPS deployment
# Configure your DigitalOcean VPS servers here

[jrok_servers]
# Format: hostname ansible_host=IP_ADDRESS ansible_user=root ansible_ssh_private_key_file=/path/to/key

# Singapore VPS
vps-sgp1 ansible_host=152.42.226.37 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[jrok_servers:vars]
# Global variables for all servers

# Domain configuration
domain_name=example.com
certbot_email=admin@example.com

# Cloudflare DNS configuration (for DNS challenge)
cloudflare_token=REPLACE_WITH_CLOUDFLARE_API_TOKEN
cloudflare_email=admin@example.com

# MongoDB configuration
mongodb_uri=mongodb+srv://user:password@cluster.mongodb.net/jrok?retryWrites=true&w=majority

# Certificate sync API key (must match server-side)
cert_sync_api_key=REPLACE_WITH_SECURE_API_KEY

# API key for authentication
api_key=023330769a0bd93af9ee64b193f6c2e6dbe0ba52f558adbd86c06e5133484e1b

# Application configuration
repo_url=https://github.com/koompi/jrok.git
repo_branch=main
app_dir=/opt/jrok

# Connection settings
ansible_port=22
ansible_connection=ssh
ansible_timeout=30

# Become settings for sudo
ansible_become=yes
ansible_become_method=sudo
ansible_become_user=root
