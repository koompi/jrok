# Ansible Inventory for kproxy VPS deployment
# Configure your DigitalOcean VPS servers here

[jrok_servers]
# Format: hostname ansible_host=IP_ADDRESS ansible_user=root ansible_ssh_private_key_file=/path/to/key
# Add vps_id, vps_region and tcp_port_* for multi-server deployments

# Singapore VPS (Primary)
vps-sgp1 ansible_host=152.42.226.37 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa vps_id=vps-sgp1 vps_host=152.42.226.37 vps_region=ap-southeast tcp_port_min=10000 tcp_port_max=13333

# Uncomment below for multi-server setup:
# vps-nyc1 ansible_host=YOUR_NYC_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa vps_id=vps-nyc1 vps_host=YOUR_NYC_IP vps_region=us-east tcp_port_min=13334 tcp_port_max=16666
# vps-lon1 ansible_host=YOUR_LON_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa vps_id=vps-lon1 vps_host=YOUR_LON_IP vps_region=eu-west tcp_port_min=16667 tcp_port_max=20000

[jrok_servers:vars]
# Global variables for all servers

# Base/control domain for the platform (also used for ALLOWED_ORIGINS)
domain_name=example.com

# Cloudflare for SaaS configuration (edge TLS + custom hostnames).
# Public TLS is terminated by Cloudflare; there is NO nginx/certbot on the host.
# - CF_API_TOKEN: scoped token with SSL/Custom Hostname edit permission on the zone
# - CF_ZONE_ID: the zone hosting your base domain
# - CF_SAAS_FALLBACK_HOSTNAME: hostname customer custom domains CNAME (DNS-only) to;
#   Cloudflare auto-issues and auto-renews the edge cert for each custom hostname.
cf_api_token=REPLACE_WITH_CLOUDFLARE_API_TOKEN
cf_zone_id=REPLACE_WITH_CLOUDFLARE_ZONE_ID
cf_saas_fallback_hostname=tunnels.example.com

# Gossip mesh shared secret (cross-node in-memory routing). Must match on all nodes.
gossip_secret=REPLACE_WITH_SECURE_GOSSIP_SECRET

# Per-node identity (can also be set per-host above):
# - vps_id:     unique node id (e.g. vps-sgp1)
# - vps_host:   public host/IP advertised to the gossip mesh
# - vps_region: region label (e.g. ap-southeast)

# MongoDB configuration
mongodb_uri=mongodb+srv://user:password@cluster.mongodb.net/jrok?retryWrites=true&w=majority

# API key for authentication
api_key=023330769a0bd93af9ee64b193f6c2e6dbe0ba52f558adbd86c06e5133484e1b

# Application configuration
repo_url=https://github.com/koompi/jrok.git
repo_branch=main
app_dir=/opt/jrok

# Connection settings
ansible_port=22
ansible_connection=ssh
ansible_timeout=30

# Become settings for sudo
ansible_become=yes
ansible_become_method=sudo
ansible_become_user=root
