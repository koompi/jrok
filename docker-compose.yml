version: '3.8'

services:
  # Bun kproxy application — terminates HTTP directly (no nginx),
  # TLS handled by Cloudflare at the edge, routing via the in-memory gossip mesh.
  kproxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kproxy-app
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # App data and logs (no /etc/nginx or /etc/letsencrypt mounts — Cloudflare owns TLS)
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://user:pass@cluster.mongodb.net/kproxy}
      - JWT_SECRET=${JWT_SECRET:-}
      - API_KEY=${API_KEY:-}
      - BASE_DOMAIN=${BASE_DOMAIN:-live.example.com}
      # Cloudflare for SaaS (custom-domain certs) — replaces Certbot/Let's Encrypt
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_ZONE_ID=${CF_ZONE_ID:-}
      - CF_SAAS_FALLBACK_HOSTNAME=${CF_SAAS_FALLBACK_HOSTNAME:-}
      # Gossip routing mesh (replaces per-tunnel nginx vhosts)
      - GOSSIP_SECRET=${GOSSIP_SECRET:-}
      - VPS_ID=${VPS_ID:-control-1}
      - VPS_HOST=${VPS_HOST:-127.0.0.1}
    networks:
      - kproxy-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Local MongoDB (use MongoDB Atlas free tier instead)
  # mongodb:
  #   image: mongo:latest
  #   container_name: kproxy-mongodb
  #   restart: always
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb_data:/data/db
  #   networks:
  #     - kproxy-net

networks:
  kproxy-net:
    driver: bridge
